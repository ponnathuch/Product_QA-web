<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>หน้าผู้ดูแล - ถามข้อมูลสินค้า</title>
<link rel="stylesheet" href="pqa-theme.css?v=1">
<style>
  /* Page layout only. Colours, fonts, radii, spacing and focus come from pqa-theme.css tokens. */
  .top-inner { max-width: var(--max-wide); }

  main { max-width: var(--max-wide); margin: calc(var(--space-6) * -1 - var(--space-3)) auto 0; padding: 0 var(--space-4) calc(var(--space-6) + var(--space-2)); }
  .panel { margin-bottom: var(--space-3); }
  .panel h2 { font-size: var(--fs-l); margin: 0 0 var(--space-3); color: var(--c-brand-strong); }
  #msg { display: flex; gap: var(--space-3); align-items: flex-start; }
  #msg.error { color: var(--c-err); font-weight: bold; }
  #msg.info { color: var(--c-ink-2); }

  .filters { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: flex-end; }
  .filters label { display: flex; flex-direction: column; font-size: var(--fs-xs); color: var(--c-ink-3); gap: var(--space-0); }
  .note { font-size: var(--fs-s); color: var(--c-ink-3); margin-top: var(--space-2); }
  .note.err { color: var(--c-err); }
  .note.ok { color: var(--c-ok); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--size-tile), 1fr)); gap: var(--space-3); margin-top: var(--space-3); }
  .tile { background: var(--c-brand-soft); border-radius: var(--radius-m); padding: var(--space-3); }
  .tile .num { font-size: var(--fs-xl); font-weight: bold; color: var(--c-brand-strong); }
  .tile .lbl { font-size: var(--fs-xs); color: var(--c-ink-2); }
  .top-nf { margin: var(--space-3) 0 0; padding-left: var(--space-5); font-size: var(--fs-s); color: var(--c-ink-2); }
  .sub { font-size: var(--fs-s); font-weight: bold; margin-top: var(--space-4); color: var(--c-ink-2); }

  .table-wrap { overflow-x: auto; margin-top: var(--space-3); border: 1px solid var(--c-line); border-radius: var(--radius-m); }
  table { border-collapse: collapse; width: 100%; font-size: var(--fs-s); min-width: var(--size-table-min); }
  th, td { padding: var(--space-2); text-align: left; vertical-align: top; border-bottom: 1px solid var(--c-line); }
  th { background: var(--c-surface-2); color: var(--c-ink-2); white-space: nowrap; }
  td.q { min-width: 180px; word-break: break-word; } /* ds-allow-hardcode: table column minimum */
  td.a { min-width: var(--size-field); color: var(--c-ink-2); word-break: break-word; }
  td.codes { font-family: var(--font-code); white-space: normal; width: 1%; }
  td.codes .code { display: block; white-space: nowrap; }
  td.codes .more { display: block; color: var(--c-ink-3); font-family: var(--font-ui); font-size: var(--fs-xs); }
  tr:last-child td { border-bottom: 0; }
  .tag { display: inline-block; border-radius: var(--radius-pill); padding: 0 var(--space-2); font-size: var(--fs-xs); background: var(--c-warn-soft); color: var(--c-warn); border: 1px solid var(--c-warn-line); }
  .pager { display: flex; gap: var(--space-3); align-items: center; margin-top: var(--space-3); flex-wrap: wrap; }

  .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--size-field), 1fr)); gap: var(--space-3); }
  .form-grid label { display: flex; flex-direction: column; font-size: var(--fs-s); color: var(--c-ink-2); gap: var(--space-1); }
  .form-grid .hint { font-size: var(--fs-xs); color: var(--c-ink-3); }

  @media (max-width: 520px) {
    .top { padding: var(--space-3) var(--space-3) calc(var(--space-6) * 2 - var(--space-3)); }
    .title p { display: none; }
    main { padding: 0 var(--space-3) var(--space-6); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none; animation: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2.5 2-2.5 3.5"/><path d="M12 15h.01"/></svg>
    </div>
    <div class="title">
      <h1>หน้าผู้ดูแล</h1>
      <p>สถิติ ประวัติคำถาม และการตั้งค่า</p>
    </div>
    <a id="backLink" class="top-link" href="app.html">กลับหน้าค้นหา</a>
  </div>
</header>

<main>
  <div id="msg" class="panel" hidden></div>

  <div id="adminBody" hidden>
    <section class="panel">
      <h2>ช่วงวันที่</h2>
      <div class="filters">
        <label>ตั้งแต่<input type="date" id="fFrom"></label>
        <label>ถึง<input type="date" id="fTo"></label>
        <label>หน่วยงาน<input type="text" id="fUnit" maxlength="60" placeholder="ทั้งหมด"></label>
        <label>ผลตอบกลับ
          <!-- ds-allow-native-select: native select keeps keyboard and screen-reader behaviour on old Edge 109 -->
          <select id="fFeedback">
            <option value="">ทั้งหมด</option>
            <option value="1">ถูกต้อง</option>
            <option value="-1">ไม่ถูกต้อง</option>
            <option value="0">ยังไม่มีความเห็น</option>
          </select>
        </label>
        <button type="button" class="btn" id="applyBtn">แสดงผล</button>
      </div>
      <div class="note" id="rangeNote">เลือกช่วงได้ไม่เกิน 92 วัน</div>
    </section>

    <section class="panel">
      <h2>สถิติ</h2>
      <div class="tiles" id="tiles"></div>
      <div class="sub" id="nfTitle" hidden>คำถามที่ไม่พบในเอกสารบ่อยที่สุด</div>
      <ol class="top-nf" id="topNf" hidden></ol>
      <div class="note" id="statsNote"></div>
    </section>

    <section class="panel">
      <h2>ประวัติคำถาม</h2>
      <div class="pager">
        <button type="button" class="btn alt" id="csvBtn">ดาวน์โหลด CSV</button>
        <span class="note" id="csvNote"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>เวลา</th><th>ชื่อ</th><th>หน่วยงาน</th><th>คำถาม</th><th>รหัสที่แสดง</th><th>คำตอบ</th><th>ผลตอบกลับ</th></tr>
          </thead>
          <tbody id="logBody"></tbody>
        </table>
      </div>
      <div class="pager">
        <button type="button" class="btn alt" id="prevBtn">ก่อนหน้า</button>
        <span id="pageInfo" class="note"></span>
        <button type="button" class="btn alt" id="nextBtn">ถัดไป</button>
      </div>
      <div class="note" id="logNote"></div>
    </section>

    <section class="panel">
      <h2>ตั้งค่า</h2>
      <div class="form-grid">
        <label>ผู้ให้บริการโมเดล
          <!-- ds-allow-native-select: native select keeps keyboard and screen-reader behaviour on old Edge 109 -->
          <select id="sProvider">
            <option value="gemini">Gemini</option>
            <option value="deepseek" disabled>DeepSeek (เปิดได้หลังตรวจนโยบายบริษัท)</option>
            <option value="none">ปิดคำตอบสรุป</option>
          </select>
          <span class="hint" id="dsHint">DeepSeek: เปิดได้หลังตรวจนโยบายบริษัท</span>
        </label>
        <label>โมเดล Gemini<input type="text" id="sGemini" maxlength="80"></label>
        <label>โมเดล DeepSeek<input type="text" id="sDeepseek" maxlength="80"></label>
        <label>จำนวนคำถามต่อคนต่อวัน (1-1000)<input type="number" id="sLimit" min="1" max="1000" step="1"></label>
        <label>งบต่อวัน (USD, 0-100)<input type="number" id="sBudget" min="0" max="100" step="0.01"></label>
        <label>โมเดลค้นหา (embedding)<input type="text" id="sEmbed" maxlength="64"></label>
        <label>ความคล้ายขั้นต่ำของการค้นหา (0.3-0.95)<input type="number" id="sMinSim" min="0.3" max="0.95" step="0.01"></label>
      </div>
      <div class="pager">
        <button type="button" class="btn" id="saveBtn">บันทึกการตั้งค่า</button>
        <span class="note" id="settingsNote"></span>
      </div>
      <div class="pager">
        <button type="button" class="btn alt" id="reindexBtn">สร้างดัชนีค้นหาใหม่</button>
        <span class="note" id="reindexNote"></span>
      </div>
    </section>
  </div>
</main>

<script>
(function () {
  var SUPABASE_URL = 'https://zuyqwkjvjuwykrdhzhwq.supabase.co';
  var TIMEOUT_MS = 20000;
  var STORE_KEY = 'pqa.session';
  var PAGE_SIZE = 50;
  var MAX_CSV_PAGES = 200;

  // BEGIN PURE
  var BOM = '\uFEFF';
  var MAX_DAYS = 92;
  function pad2(n) { return n < 10 ? '0' + n : String(n); }
  // Asia/Bangkok is a fixed UTC+7 zone (no daylight saving).
  function bangkokShift(iso) {
    var ms = typeof iso === 'number' ? iso : Date.parse(iso);
    if (isNaN(ms)) return null;
    return new Date(ms + 7 * 3600 * 1000);
  }
  function bangkokDate(iso) {
    var d = bangkokShift(iso);
    return d ? d.toISOString().slice(0, 10) : '';
  }
  function bangkokDateTime(iso) {
    var d = bangkokShift(iso);
    if (!d) return '';
    return d.toISOString().slice(0, 10) + ' ' + pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes());
  }
  function parseDay(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
    var ms = Date.parse(s + 'T00:00:00Z');
    if (isNaN(ms)) return null;
    if (new Date(ms).toISOString().slice(0, 10) !== s) return null;
    return ms;
  }
  function validateRange(from, to) {
    var a = parseDay(from);
    var b = parseDay(to);
    if (a === null || b === null) return { ok: false, error: 'กรุณาเลือกวันที่ให้ครบ' };
    if (a > b) return { ok: false, error: 'วันที่เริ่มต้องไม่หลังวันที่สิ้นสุด' };
    var days = Math.round((b - a) / 86400000) + 1;
    if (days > MAX_DAYS) return { ok: false, error: 'เลือกช่วงได้ไม่เกิน ' + MAX_DAYS + ' วัน' };
    return { ok: true, days: days };
  }
  function defaultRange(nowMs) {
    var to = bangkokDate(nowMs);
    var from = bangkokDate(Date.parse(to + 'T00:00:00Z') - 6 * 86400000 + 7 * 3600 * 1000);
    return { from: from, to: to };
  }
  function csvField(v) {
    var s = v === null || v === undefined ? '' : String(v);
    return '"' + s.replace(/"/g, '""') + '"';
  }
  // rows: array of arrays. Every field quoted, CRLF between lines, UTF-8 BOM first so Excel shows Thai.
  function toCsv(rows) {
    var lines = [];
    for (var i = 0; i < rows.length; i++) {
      var cells = [];
      for (var j = 0; j < rows[i].length; j++) cells.push(csvField(rows[i][j]));
      lines.push(cells.join(','));
    }
    return BOM + lines.join('\r\n') + '\r\n';
  }
  var CSV_HEAD = ['เวลา', 'ชื่อ', 'หน่วยงาน', 'คำถาม', 'รหัสที่แสดง', 'คำตอบ', 'ไม่พบ', 'ผลตอบกลับ', 'หมายเหตุ'];
  function pick(o, a, b) {
    if (!o) return undefined;
    if (o[a] !== undefined && o[a] !== null) return o[a];
    if (b && o[b] !== undefined && o[b] !== null) return o[b];
    return undefined;
  }
  function feedbackText(v) {
    if (v === 1) return 'ถูกต้อง';
    if (v === -1) return 'ไม่ถูกต้อง';
    return '';
  }
  function droppedText(v) {
    if (v === 'unknown_code') return 'ตัดคำตอบ: รหัสไม่ตรงเอกสาร';
    if (v === 'provider_error') return 'โมเดลตอบไม่ได้';
    if (v === 'budget') return 'เกินงบประจำวัน';
    if (v === 'disabled') return 'ปิดคำตอบสรุป';
    return '';
  }
  function codesText(v) {
    return Array.isArray(v) ? v.join(' ') : '';
  }
  // Table cell only (CSV keeps every code): first few codes one per line, then "+N".
  var CODES_SHOWN = 3;
  function shortCodes(text) {
    var all = String(text || '').split(' ').filter(function (x) { return x !== ''; });
    return { shown: all.slice(0, CODES_SHOWN), more: Math.max(0, all.length - CODES_SHOWN), full: all.join(' ') };
  }
  function logRowCells(r) {
    var unit = pick(r, 'un') !== undefined ? pick(r, 'un') : pick(r, 'unit');
    return [
      bangkokDateTime(pick(r, 'asked_at', 'askedAt')),
      pick(r, 'n'),
      unit,
      pick(r, 'question'),
      codesText(pick(r, 'item_codes', 'itemCodes')),
      pick(r, 'answer'),
      pick(r, 'not_in_catalog', 'notInCatalog') ? 'ไม่พบ' : '',
      feedbackText(pick(r, 'feedback')),
      droppedText(pick(r, 'answer_dropped', 'answerDropped'))
    ];
  }
  function csvFileName(from, to) { return 'question-log_' + from + '_' + to + '.csv'; }
  function validateSettings(v) {
    var lim = Number(v.daily_user_limit);
    var bud = Number(v.daily_budget_usd);
    if (!(lim >= 1 && lim <= 1000) || Math.floor(lim) !== lim) return 'จำนวนคำถามต่อคนต่อวันต้องเป็นเลข 1-1000';
    if (!(bud >= 0 && bud <= 100)) return 'งบต่อวันต้องอยู่ระหว่าง 0-100';
    if (['gemini', 'deepseek', 'none'].indexOf(v.provider) < 0) return 'ผู้ให้บริการไม่ถูกต้อง';
    if (!v.gemini_model || !v.deepseek_model) return 'กรุณากรอกชื่อโมเดล';
    if (!v.embed_model) return 'กรุณากรอกชื่อโมเดลค้นหา';
    var sim = Number(v.vector_min_similarity);
    if (!(sim >= 0.3 && sim <= 0.95)) return 'ความคล้ายขั้นต่ำต้องอยู่ระหว่าง 0.3-0.95';
    return '';
  }
  function isAdminSession(stored, now) {
    if (!stored || typeof stored !== 'object') return false;
    if (typeof stored.session !== 'string' || !stored.session) return false;
    if (typeof stored.expiresAt !== 'number' || stored.expiresAt <= now) return false;
    return stored.isAdmin === true;
  }
  // Decides what the reindex loop does after one reply.
  // state: { afterId, total } before the call; r: { status, data } from callAdmin.
  // Returns { kind: 'next', req, state } | { kind: 'done', total } | { kind: 'error', total }.
  function reindexStep(state, r) {
    var total = state.total;
    var d = r && r.data;
    if (!r || r.status !== 200 || !d || d.ok !== true) return { kind: 'error', total: total };
    var rows = Number(d.rows);
    var lastId = Number(d.lastId);
    if (!isFinite(rows) || rows < 0 || !isFinite(lastId)) return { kind: 'error', total: total };
    total += rows;
    if (d.done === true) return { kind: 'done', total: total };
    if (lastId <= state.afterId) return { kind: 'error', total: total }; // no progress: stop, never loop forever
    return {
      kind: 'next',
      req: { action: 'reindex', afterId: lastId },
      state: { afterId: lastId, total: total }
    };
  }
  // END PURE

  function $(id) { return document.getElementById(id); }
  var els = {
    msg: $('msg'), body: $('adminBody'),
    from: $('fFrom'), to: $('fTo'), unit: $('fUnit'), fb: $('fFeedback'), apply: $('applyBtn'), rangeNote: $('rangeNote'),
    tiles: $('tiles'), nfTitle: $('nfTitle'), topNf: $('topNf'), statsNote: $('statsNote'),
    csv: $('csvBtn'), csvNote: $('csvNote'), logBody: $('logBody'),
    prev: $('prevBtn'), next: $('nextBtn'), pageInfo: $('pageInfo'), logNote: $('logNote'),
    provider: $('sProvider'), gemini: $('sGemini'), deepseek: $('sDeepseek'), limit: $('sLimit'), budget: $('sBudget'),
    embed: $('sEmbed'), minSim: $('sMinSim'),
    save: $('saveBtn'), settingsNote: $('settingsNote'),
    reindex: $('reindexBtn'), reindexNote: $('reindexNote')
  };
  var session = null;
  var filter = null;
  var page = 1;
  var total = 0;
  var settingsLoaded = null;

  function addText(parent, tag, cls, text) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    el.textContent = text;
    parent.appendChild(el);
    return el;
  }
  function showMessage(text, isError) {
    els.msg.hidden = false;
    els.msg.className = 'panel ' + (isError ? 'error' : 'info');
    els.msg.textContent = text;
  }
  function note(el, text, cls) { el.textContent = text; el.className = 'note' + (cls ? ' ' + cls : ''); }

  function loadStored() {
    try {
      var raw = sessionStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function callAdmin(payload, timeoutMs) {
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, timeoutMs || TIMEOUT_MS);
    return fetch(SUPABASE_URL + '/functions/v1/admin', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-pqa-session': session.session },
      body: JSON.stringify(payload),
      cache: 'no-store',
      signal: controller.signal
    }).then(function (resp) {
      clearTimeout(timer);
      return resp.json().then(function (data) {
        return { status: resp.status, data: data };
      }, function () {
        return { status: resp.status, data: null };
      });
    }, function () {
      clearTimeout(timer);
      return { status: 0, data: null };
    });
  }
  function failText(r) {
    if (r.status === 401) return 'เซสชันหมดอายุ กรุณาเปิดจากเมนู ถามข้อมูลสินค้า ใน Job Tracker อีกครั้ง';
    if (r.status === 403) return 'ไม่มีสิทธิ์ผู้ดูแล';
    if (r.status === 400 && r.data && typeof r.data.message === 'string') return r.data.message;
    return 'ติดต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่อีกครั้ง';
  }

  function money(v) {
    var n = Number(v);
    return isFinite(n) ? n.toFixed(4) : '0.0000';
  }

  function renderStats(s) {
    els.tiles.textContent = '';
    var defs = [
      ['questions', 'คำถามทั้งหมด'], ['users', 'ผู้ถาม (คน)'], ['answered', 'มีคำตอบสรุป'],
      ['notFound', 'ไม่พบในเอกสาร'], ['dropped', 'ไม่มีคำตอบสรุป'],
      ['thumbsUp', 'ถูกต้อง'], ['thumbsDown', 'ไม่ถูกต้อง']
    ];
    defs.forEach(function (d) {
      var t = document.createElement('div');
      t.className = 'tile';
      addText(t, 'div', 'num', String(Number(s[d[0]]) || 0));
      addText(t, 'div', 'lbl', d[1]);
      els.tiles.appendChild(t);
    });
    var c = document.createElement('div');
    c.className = 'tile';
    addText(c, 'div', 'num', money(s.costUsd));
    addText(c, 'div', 'lbl', 'ค่าใช้จ่าย (USD)');
    els.tiles.appendChild(c);

    els.topNf.textContent = '';
    var list = Array.isArray(s.topNotFound) ? s.topNotFound : [];
    els.nfTitle.hidden = list.length === 0;
    els.topNf.hidden = list.length === 0;
    list.forEach(function (x) {
      addText(els.topNf, 'li', '', String(x.question) + ' (' + Number(x.count) + ' ครั้ง)');
    });
  }

  function loadStats() {
    note(els.statsNote, 'กำลังโหลด...', '');
    return callAdmin({ action: 'stats', from: filter.from, to: filter.to }).then(function (r) {
      if (r.status === 200 && r.data) {
        renderStats(r.data);
        note(els.statsNote, '', '');
      } else {
        note(els.statsNote, failText(r), 'err');
      }
    });
  }

  function logPayload(p) {
    var o = { action: 'log', from: filter.from, to: filter.to, page: p };
    if (filter.unit) o.unit = filter.unit;
    if (filter.feedback !== '') o.feedback = Number(filter.feedback);
    return o;
  }
  function rowsOf(data) {
    if (!data) return [];
    if (Array.isArray(data.rows)) return data.rows;
    if (Array.isArray(data.log)) return data.log;
    if (Array.isArray(data.items)) return data.items;
    return [];
  }

  function renderLog(rows) {
    els.logBody.textContent = '';
    if (rows.length === 0) {
      var tr0 = document.createElement('tr');
      var td0 = addText(tr0, 'td', '', 'ไม่มีข้อมูลในช่วงนี้');
      td0.colSpan = 7;
      els.logBody.appendChild(tr0);
      return;
    }
    rows.forEach(function (r) {
      var c = logRowCells(r);
      var tr = document.createElement('tr');
      addText(tr, 'td', '', c[0]);
      addText(tr, 'td', '', c[1] === undefined ? '' : String(c[1]));
      addText(tr, 'td', '', c[2] === undefined ? '' : String(c[2]));
      addText(tr, 'td', 'q', c[3] === undefined ? '' : String(c[3]));
      var tc = addText(tr, 'td', 'codes', '');
      var sc = shortCodes(c[4]);
      sc.shown.forEach(function (x) { addText(tc, 'span', 'code', x); });
      if (sc.more > 0) addText(tc, 'span', 'more', '+' + sc.more + ' รายการ');
      if (sc.full) tc.title = sc.full;
      var ta = addText(tr, 'td', 'a', c[5] === undefined || c[5] === null ? '' : String(c[5]));
      if (c[6]) addText(ta, 'div', '', c[6]);
      if (c[8]) addText(ta, 'span', 'tag', c[8]);
      addText(tr, 'td', '', c[7]);
      els.logBody.appendChild(tr);
    });
  }

  function updatePager() {
    var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    els.pageInfo.textContent = 'หน้า ' + page + ' / ' + pages + ' (ทั้งหมด ' + total + ' รายการ)';
    els.prev.disabled = page <= 1;
    els.next.disabled = page >= pages;
  }

  function loadLog(p) {
    note(els.logNote, 'กำลังโหลด...', '');
    els.prev.disabled = true;
    els.next.disabled = true;
    return callAdmin(logPayload(p)).then(function (r) {
      if (r.status === 200 && r.data) {
        page = p;
        total = Number(r.data.total) || 0;
        renderLog(rowsOf(r.data));
        note(els.logNote, '', '');
      } else {
        note(els.logNote, failText(r), 'err');
      }
      updatePager();
    });
  }

  function readFilter() {
    var v = validateRange(els.from.value, els.to.value);
    if (!v.ok) {
      note(els.rangeNote, v.error, 'err');
      return false;
    }
    note(els.rangeNote, 'เลือกช่วงได้ไม่เกิน ' + MAX_DAYS + ' วัน', '');
    filter = { from: els.from.value, to: els.to.value, unit: els.unit.value.trim(), feedback: els.fb.value };
    return true;
  }

  function applyFilter() {
    if (!readFilter()) return;
    loadStats();
    loadLog(1);
  }

  function downloadCsv() {
    if (!readFilter()) return;
    els.csv.disabled = true;
    note(els.csvNote, 'กำลังเตรียมไฟล์...', '');
    var all = [CSV_HEAD];
    var snapshot = filter;
    function step(p) {
      return callAdmin({ action: 'log', from: snapshot.from, to: snapshot.to, page: p,
        unit: snapshot.unit || undefined, feedback: snapshot.feedback === '' ? undefined : Number(snapshot.feedback) }).then(function (r) {
        if (!(r.status === 200 && r.data)) throw new Error(failText(r));
        var rows = rowsOf(r.data);
        rows.forEach(function (x) { all.push(logRowCells(x)); });
        var tot = Number(r.data.total) || 0;
        if (rows.length > 0 && p * PAGE_SIZE < tot && p < MAX_CSV_PAGES) return step(p + 1);
        return null;
      });
    }
    step(1).then(function () {
      var blob = new Blob([toCsv(all)], { type: 'text/csv;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = csvFileName(snapshot.from, snapshot.to);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      note(els.csvNote, 'ดาวน์โหลดแล้ว ' + (all.length - 1) + ' แถว', 'ok');
    }, function (e) {
      note(els.csvNote, e && e.message ? e.message : 'ดาวน์โหลดไม่สำเร็จ', 'err');
    }).then(function () { els.csv.disabled = false; });
  }

  function fillSettings(s) {
    settingsLoaded = s;
    els.provider.value = pick(s, 'provider') || 'gemini';
    els.gemini.value = pick(s, 'gemini_model', 'geminiModel') || '';
    els.deepseek.value = pick(s, 'deepseek_model', 'deepseekModel') || '';
    els.limit.value = pick(s, 'daily_user_limit', 'dailyUserLimit') || '';
    els.budget.value = pick(s, 'daily_budget_usd', 'dailyBudgetUsd') || '';
    els.embed.value = pick(s, 'embed_model', 'embedModel') || '';
    els.minSim.value = pick(s, 'vector_min_similarity', 'vectorMinSimilarity') || '';
    var enabled = pick(s, 'deepseek_enabled', 'deepseekEnabled') === true;
    els.provider.querySelector('option[value="deepseek"]').disabled = !enabled;
    var by = pick(s, 'updated_by', 'updatedBy');
    var at = pick(s, 'updated_at', 'updatedAt');
    if (at) note(els.settingsNote, 'แก้ไขล่าสุด ' + bangkokDateTime(at) + (by ? ' โดย ' + by : ''), '');
  }

  function loadSettings() {
    return callAdmin({ action: 'settings.get' }).then(function (r) {
      if (r.status === 200 && r.data) {
        fillSettings(r.data.settings && typeof r.data.settings === 'object' ? r.data.settings : r.data);
      } else {
        note(els.settingsNote, failText(r), 'err');
      }
    });
  }

  function saveSettings() {
    var v = {
      provider: els.provider.value,
      gemini_model: els.gemini.value.trim(),
      deepseek_model: els.deepseek.value.trim(),
      daily_user_limit: Number(els.limit.value),
      daily_budget_usd: Number(els.budget.value),
      embed_model: els.embed.value.trim(),
      vector_min_similarity: Number(els.minSim.value)
    };
    var bad = validateSettings(v);
    if (bad) { note(els.settingsNote, bad, 'err'); return; }
    els.save.disabled = true;
    note(els.settingsNote, 'กำลังบันทึก...', '');
    var payload = { action: 'settings.set', settings: v };
    callAdmin(payload).then(function (r) {
      els.save.disabled = false;
      if (r.status === 200 && r.data) {
        if (r.data.settings && typeof r.data.settings === 'object') fillSettings(r.data.settings);
        note(els.settingsNote, 'บันทึกแล้ว', 'ok');
      } else {
        note(els.settingsNote, failText(r), 'err');
      }
    });
  }

  function reindexAll() {
    if (!window.confirm('สร้างดัชนีค้นหาใหม่ทั้งหมด? ระบบจะทำทีละชุดจนครบ อาจใช้เวลาหลายนาที และมีค่าใช้จ่ายเล็กน้อย')) return;
    els.reindex.disabled = true;
    var startedAt = Date.now();
    note(els.reindexNote, 'กำลังสร้างดัชนี... ทำแล้ว 0 รายการ', '');

    function finish(text, cls) {
      els.reindex.disabled = false;
      note(els.reindexNote, text, cls);
    }

    function run(req, state) {
      callAdmin(req, 150000).then(function (r) {
        var step = reindexStep(state, r);
        if (step.kind === 'next') {
          note(els.reindexNote, 'กำลังสร้างดัชนี... ทำแล้ว ' + step.state.total + ' รายการ', '');
          run(step.req, step.state);
        } else if (step.kind === 'done') {
          var secs = Math.round((Date.now() - startedAt) / 100) / 10;
          finish('สร้างดัชนีเสร็จ ' + step.total + ' รายการ ใช้เวลา ' + secs + ' วินาที', 'ok');
        } else {
          finish(failText(r) + ' (ทำแล้ว ' + step.total + ' รายการ)', 'err');
        }
      });
    }

    run({ action: 'reindex' }, { afterId: 0, total: 0 });
  }

  function start() {
    var stored = loadStored();
    if (!stored || !isAdminSession(stored, Date.now())) {
      var hasSession = stored && typeof stored.session === 'string' && stored.expiresAt > Date.now();
      showMessage(hasSession ? 'หน้านี้สำหรับผู้ดูแลเท่านั้น' : 'กรุณาเปิดจากเมนู ถามข้อมูลสินค้า ใน Job Tracker', true);
      return;
    }
    session = stored;
    els.msg.hidden = true;
    els.body.hidden = false;
    var r = defaultRange(Date.now());
    els.from.value = r.from;
    els.to.value = r.to;
    els.apply.addEventListener('click', applyFilter);
    els.csv.addEventListener('click', downloadCsv);
    els.prev.addEventListener('click', function () { if (page > 1) loadLog(page - 1); });
    els.next.addEventListener('click', function () { loadLog(page + 1); });
    els.save.addEventListener('click', saveSettings);
    els.reindex.addEventListener('click', reindexAll);
    applyFilter();
    loadSettings();
  }

  start();
})();
</script>
</body>
</html>
