<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ถามข้อมูลสินค้า</title>
<link rel="stylesheet" href="pqa-theme.css?v=1">
<style>
  /* Page layout only. Colours, fonts, radii, spacing and focus come from pqa-theme.css tokens. */
  .top-inner { max-width: var(--max-narrow); }
  #who {
    display: flex; align-items: center; gap: var(--space-2);
    background: var(--c-on-header-soft); border-radius: var(--radius-pill);
    padding: var(--space-1) var(--space-3) var(--space-1) var(--space-1); font-size: var(--fs-s); max-width: 52%;
  }
  #who:empty { display: none; }
  .avatar {
    width: var(--size-avatar); height: var(--size-avatar); flex: 0 0 var(--size-avatar); border-radius: 50%;
    background: var(--c-on-header); color: var(--c-header-1); font-weight: bold;
    display: flex; align-items: center; justify-content: center; font-size: var(--fs-s);
  }
  .who-text { min-width: 0; line-height: 1.25; }
  .who-name, .who-unit { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who-unit { opacity: 0.88; font-size: var(--fs-xs); }
  .badge-admin {
    font-size: var(--fs-xs); background: var(--c-badge); color: var(--c-badge-ink);
    border-radius: var(--radius-pill); padding: 0 var(--space-2); margin-left: var(--space-1); font-weight: bold;
  }

  /* ---------- body ---------- */
  main { max-width: var(--max-narrow); margin: calc(var(--space-6) * -1 - var(--space-3)) auto 0; padding: 0 var(--space-4) calc(var(--space-6) + var(--space-2)); }
  #msg { margin-bottom: var(--space-3); display: flex; gap: var(--space-3); align-items: flex-start; }
  #msg .msg-icon { flex: 0 0 var(--size-icon); width: var(--size-icon); height: var(--size-icon); margin-top: var(--space-0); }
  #msg.error { color: var(--c-err); font-weight: bold; }
  #msg.info { color: var(--c-ink-2); }

  #searchBox { margin-bottom: var(--space-4); }
  .search-row { display: flex; gap: var(--space-3); }
  .field { position: relative; flex: 1; min-width: 0; }
  .field svg {
    position: absolute; left: var(--space-3); top: 50%; width: var(--size-icon); height: var(--size-icon);
    margin-top: calc(var(--size-icon) / -2); color: var(--c-ink-3); pointer-events: none;
  }
  #q {
    width: 100%; min-height: var(--size-target-lg); padding: var(--space-3) var(--space-6) var(--space-3) var(--space-6);
    padding-left: calc(var(--space-6) + var(--space-3)); font-size: var(--fs-l);
    border: 1px solid var(--c-line-strong); border-radius: var(--radius-m); background: var(--c-surface); color: var(--c-ink);
    transition: border-color var(--dur-fast), box-shadow var(--dur-fast);
  }
  #q::placeholder { color: var(--c-ink-3); }
  #clearBtn {
    position: absolute; right: var(--space-1); top: 50%; margin-top: calc(var(--size-target) / -2);
    width: var(--size-target); height: var(--size-target);
    border: 0; border-radius: 50%; background: transparent; color: var(--c-ink-3); cursor: pointer;
    font-size: var(--fs-l); line-height: 1; padding: 0;
  }
  #clearBtn:hover { background: var(--c-surface-2); color: var(--c-ink); }
  #goBtn { padding: 0 var(--space-5); font-size: var(--fs-l); min-height: var(--size-target-lg); }
  .chips { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); align-items: center; }
  .chips-label { font-size: var(--fs-s); color: var(--c-ink-3); margin-right: var(--space-0); }
  .chip {
    min-height: var(--size-target);
    border: 1px solid var(--c-line-strong); background: var(--c-surface); color: var(--c-ink-2);
    border-radius: var(--radius-pill); padding: var(--space-1) var(--space-3); font-size: var(--fs-s); cursor: pointer;
    transition: background var(--dur-fast), border-color var(--dur-fast), color var(--dur-fast);
  }
  .chip:hover { border-color: var(--c-brand); color: var(--c-brand-strong); background: var(--c-brand-soft); }

  #status { color: var(--c-ink-3); font-size: var(--fs-s); margin: 0 var(--space-1) var(--space-3); min-height: 1.4em; }

  /* ---------- result cards ---------- */
  .card {
    background: var(--c-surface); border-radius: var(--radius-l); box-shadow: var(--shadow-1);
    padding: var(--space-4); margin-bottom: var(--space-3); border: 1px solid var(--c-line);
  }
  .card-head { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-2); flex-wrap: wrap; }
  .code {
    font-family: var(--font-code); font-size: var(--fs-xl); font-weight: bold;
    letter-spacing: 0.1em; color: var(--c-brand-strong); background: var(--c-brand-soft);
    border-radius: var(--radius-s); padding: var(--space-0) var(--space-3);
  }
  .copy {
    min-height: var(--size-target);
    border: 1px solid var(--c-line-strong); background: var(--c-surface); color: var(--c-ink-2); border-radius: var(--radius-s);
    padding: var(--space-1) var(--space-3); font-size: var(--fs-s); cursor: pointer;
    transition: background var(--dur-fast), border-color var(--dur-fast), color var(--dur-fast);
  }
  .copy:hover { border-color: var(--c-brand); color: var(--c-brand-strong); }
  .copy.done { border-color: var(--c-ok); color: var(--c-ok); }
  .name { font-size: var(--fs-l); font-weight: bold; margin: var(--space-0) 0 var(--space-2); color: var(--c-ink); }
  .details { list-style: none; margin: 0; padding: 0; }
  .details li {
    position: relative; padding-left: var(--space-5); font-size: var(--fs-m); color: var(--c-ink-2); margin: var(--space-1) 0;
  }
  .details li::before {
    content: ""; position: absolute; left: var(--space-0); top: 0.38em; width: 14px; height: 14px; /* ds-allow-hardcode: checkbox glyph geometry */
    border-radius: var(--space-1); background: var(--c-brand-soft);
    box-shadow: inset 0 0 0 1px var(--c-brand-line);
  }
  .details li::after {
    content: ""; position: absolute; left: 6px; top: 0.52em; width: 6px; height: 3px; /* ds-allow-hardcode: checkmark glyph geometry */
    border-left: 2px solid var(--c-brand); border-bottom: 2px solid var(--c-brand); /* ds-allow-hardcode: checkmark stroke */
    transform: rotate(-45deg);
  }
  .dup {
    display: flex; gap: var(--space-2); align-items: flex-start;
    margin-top: var(--space-3); padding: var(--space-2) var(--space-3); background: var(--c-warn-soft); border: 1px solid var(--c-warn-line);
    border-radius: var(--radius-s); color: var(--c-warn); font-size: var(--fs-s);
  }
  .dup svg { flex: 0 0 var(--size-icon-s); width: var(--size-icon-s); height: var(--size-icon-s); margin-top: var(--space-0); }
  .cite {
    display: flex; align-items: center; gap: var(--space-3); width: 100%; min-height: var(--size-target); margin-top: var(--space-3); padding: var(--space-2) var(--space-3);
    text-align: left; font-size: var(--fs-s); border: 1px solid var(--c-brand-line); border-radius: var(--radius-s);
    background: var(--c-surface-2); color: var(--c-brand-strong); cursor: pointer;
    transition: background var(--dur-fast), border-color var(--dur-fast);
  }
  .cite:hover { background: var(--c-brand-soft); border-color: var(--c-brand); }
  .cite svg { flex: 0 0 var(--size-icon); width: var(--size-icon); height: var(--size-icon); }
  .cite-text { flex: 1; min-width: 0; }
  .cite-go { font-weight: bold; white-space: nowrap; }

  /* ---------- Product Files on the card: photo, certificate banner, document chips ---------- */
  .body { display: flex; gap: var(--space-3); align-items: flex-start; }
  .info { flex: 1; min-width: 0; }
  .thumb {
    position: relative; flex: 0 0 var(--size-thumb); width: var(--size-thumb); height: var(--size-thumb); padding: 0;
    border: 1px solid var(--c-line); border-radius: var(--radius-m); background: var(--c-img-backing); cursor: pointer; overflow: hidden;
  }
  .thumb:hover { border-color: var(--c-brand); }
  .thumb img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .thumb .count {
    position: absolute; right: var(--space-1); bottom: var(--space-1); font-size: var(--fs-xs);
    background: var(--c-scrim-bar); color: var(--c-scrim-ink); border-radius: var(--radius-s); padding: 0 var(--space-2);
  }
  .cert {
    display: flex; gap: var(--space-3); align-items: flex-start; margin-top: var(--space-3);
    border: 1px solid; border-radius: var(--radius-s); padding: var(--space-2) var(--space-3); font-size: var(--fs-s);
  }
  .cert b { display: block; }
  .cert-dot { flex: 0 0 var(--space-3); width: var(--space-3); height: var(--space-3); margin-top: var(--space-1); border-radius: 50%; background: currentColor; }
  .cert.ok { background: var(--c-ok-soft); color: var(--c-ok); border-color: var(--c-ok-line); }
  .cert.warn { background: var(--c-warn-soft); color: var(--c-warn); border-color: var(--c-warn-line); }
  .cert.err { background: var(--c-err-soft); color: var(--c-err); border-color: var(--c-err-line); }
  .docs { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); }
  .doc {
    display: inline-flex; align-items: center; gap: var(--space-2); min-height: var(--size-target);
    border: 1px solid var(--c-brand-line); background: var(--c-surface-2); color: var(--c-brand-strong);
    border-radius: var(--radius-pill); padding: var(--space-1) var(--space-3); font-size: var(--fs-s); cursor: pointer;
    transition: background var(--dur-fast), border-color var(--dur-fast);
  }
  .doc:hover { background: var(--c-brand-soft); border-color: var(--c-brand); }
  .doc i { flex: 0 0 var(--space-2); width: var(--space-2); height: var(--space-2); border-radius: var(--space-0); background: var(--kind); }
  .k-catalog { --kind: var(--c-kind-catalog); } .k-photo { --kind: var(--c-kind-photo); } .k-spec { --kind: var(--c-kind-spec); }
  .k-shipping { --kind: var(--c-kind-shipping); } .k-promo { --kind: var(--c-kind-promo); } .k-payment { --kind: var(--c-kind-payment); }
  .k-cert { --kind: var(--c-kind-cert); } .k-other { --kind: var(--c-kind-other); }

  .in-answer {
    font-size: var(--fs-xs); font-weight: bold; color: var(--c-ok); background: var(--c-ok-soft);
    border-radius: var(--radius-pill); padding: var(--space-0) var(--space-2);
  }
  .more { margin-top: var(--space-1); }
  .more > summary {
    display: flex; align-items: center; min-height: var(--size-target);
    cursor: pointer; list-style: none; padding: var(--space-2) var(--space-3); margin-bottom: var(--space-3);
    border: 1px dashed var(--c-line-strong); border-radius: var(--radius-m); color: var(--c-ink-2); background: var(--c-surface);
    font-size: var(--fs-s);
  }
  .more > summary::-webkit-details-marker { display: none; }
  .more > summary::before { content: "+ "; font-weight: bold; color: var(--c-brand); white-space: pre; }
  .more[open] > summary::before { content: "− "; }
  .more-note { font-size: var(--fs-xs); color: var(--c-ink-3); margin: calc(var(--space-1) * -1) var(--space-1) var(--space-3); }

  /* ---------- answer panel and feedback ---------- */
  .answer {
    background: var(--c-surface-2); border: 1px solid var(--c-line-strong); border-radius: var(--radius-l);
    padding: var(--space-3) var(--space-4); margin-bottom: var(--space-3);
  }
  .answer-label {
    display: flex; align-items: center; gap: var(--space-2);
    font-size: var(--fs-s); font-weight: bold; color: var(--c-brand-strong); margin-bottom: var(--space-1);
  }
  .answer-label svg { width: var(--size-icon-s); height: var(--size-icon-s); flex: 0 0 var(--size-icon-s); }
  .answer-text p { margin: 0 0 var(--space-2); font-size: var(--fs-m); color: var(--c-ink); word-break: break-word; }
  .answer-text p.gap { height: 0.6em; margin: 0; }
  .answer-note { font-size: var(--fs-xs); color: var(--c-ink-3); margin-top: var(--space-2); }
  .fb { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); margin: 0 var(--space-1) var(--space-4); font-size: var(--fs-s); color: var(--c-ink-2); }
  .fb-btn {
    display: inline-flex; align-items: center; gap: var(--space-2); min-height: var(--size-target);
    border: 1px solid var(--c-line-strong); background: var(--c-surface); color: var(--c-ink-2);
    border-radius: var(--radius-pill); padding: var(--space-1) var(--space-4); font-size: var(--fs-s); cursor: pointer;
    transition: background var(--dur-fast), border-color var(--dur-fast), color var(--dur-fast);
  }
  .fb-btn svg { width: var(--size-icon-s); height: var(--size-icon-s); flex: 0 0 var(--size-icon-s); }
  .fb-btn:hover { border-color: var(--c-brand); color: var(--c-brand-strong); }
  .fb-btn:disabled { cursor: not-allowed; opacity: 0.6; }
  .fb-btn.sel { border-color: var(--c-brand); background: var(--c-brand-soft); color: var(--c-brand-strong); font-weight: bold; }
  .fb-thanks { color: var(--c-ok); }
  .fb-err { color: var(--c-err); font-size: var(--fs-s); }

  .empty { text-align: center; padding: var(--space-5) var(--space-4); }
  .empty svg { width: var(--size-empty); height: var(--size-empty); color: var(--c-line-strong); }
  .empty .empty-title { font-size: var(--fs-l); font-weight: bold; margin-top: var(--space-2); color: var(--c-ink); }
  .empty .hint { color: var(--c-ink-3); font-size: var(--fs-s); margin-top: var(--space-1); }

  .skeleton { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--radius-l); box-shadow: var(--shadow-1); padding: var(--space-4); margin-bottom: var(--space-3); }
  .sk { height: var(--space-3); border-radius: var(--space-1); margin: var(--space-2) 0; background: linear-gradient(90deg, var(--c-line) 25%, var(--c-surface-2) 50%, var(--c-line) 75%); background-size: 200% 100%; animation: shimmer var(--dur-shimmer) infinite linear; }
  .sk.w30 { width: 30%; height: var(--space-5); } .sk.w70 { width: 70%; } .sk.w50 { width: 50%; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  .foot { text-align: center; color: var(--c-ink-3); font-size: var(--fs-xs); margin-top: var(--space-5); }

  /* ---------- page image viewer ---------- */
  #overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: var(--c-scrim); z-index: 10; flex-direction: column;
  }
  #overlay.open { display: flex; }
  #ovBar { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); background: var(--c-scrim-bar); color: var(--c-scrim-ink); }
  #ovText { flex: 1; min-width: 0; font-size: var(--fs-s); }
  #ovClose {
    min-height: var(--size-target); padding: var(--space-2) var(--space-4); font-size: var(--fs-s); border: 0; border-radius: var(--radius-m);
    background: var(--c-scrim-ink); color: var(--c-scrim-ink-on); cursor: pointer; font-weight: bold;
  }
  #ovTabs { display: flex; gap: var(--space-2); padding: var(--space-3) var(--space-3) 0; overflow-x: auto; }
  .ov-tab {
    flex: 0 0 auto; min-height: var(--size-target); border: 0; border-radius: var(--radius-pill); padding: var(--space-1) var(--space-3);
    background: var(--c-scrim-bar); color: var(--c-scrim-ink); font-size: var(--fs-s); cursor: pointer;
  }
  .ov-tab[aria-selected="true"] { background: var(--c-scrim-ink); color: var(--c-scrim-ink-on); font-weight: bold; }
  #ovStage { position: relative; }
  .ov-nav {
    position: absolute; top: 50%; margin-top: calc(var(--size-target-lg) / -2); width: var(--size-target-lg); height: var(--size-target-lg);
    display: flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 50%;
    background: var(--c-scrim-ink); color: var(--c-scrim-ink-on); cursor: pointer;
  }
  .ov-nav svg { width: var(--size-icon); height: var(--size-icon); }
  #ovPrev { left: var(--space-3); }
  #ovNext { right: var(--space-3); }
  #ovStrip { display: flex; gap: var(--space-2); padding: var(--space-2) var(--space-3) var(--space-3); overflow-x: auto; }
  .ov-thumb {
    flex: 0 0 auto; width: var(--size-strip-w); height: var(--size-strip-h); padding: 0; overflow: hidden;
    border: var(--outline-w) solid transparent; border-radius: var(--radius-s); background: var(--c-img-backing); color: var(--c-scrim-ink-on);
    font-size: var(--fs-xs); opacity: 0.6; cursor: pointer;
  }
  .ov-thumb[aria-current="true"] { opacity: 1; border-color: var(--c-scrim-ink); }
  .ov-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  #ovBody { flex: 1; overflow: auto; padding: var(--space-3); }
  #ovImg { width: 100%; max-width: var(--max-page-image); height: auto; display: block; margin: 0 auto; border-radius: var(--radius-s); background: var(--c-img-backing); }
  #ovErr { color: var(--c-scrim-ink); padding: var(--space-5) var(--space-3); text-align: center; }

  .title h1 { white-space: nowrap; }
  @media (max-width: 520px) {
    .top { padding: var(--space-3) var(--space-3) calc(var(--space-6) * 2 - var(--space-3)); }
    .top-inner { flex-wrap: wrap; }
    .title p { display: none; }
    #who { order: 3; flex: 1 1 100%; max-width: 100%; }
    #adminLink { order: 4; }
    main { padding: 0 var(--space-3) var(--space-6); }
    .search-row { flex-direction: column; }
    #goBtn { padding: var(--space-3); }
    .fb-btn { min-height: var(--size-target-lg); }
    .code { font-size: var(--fs-l); }
  }
  @media (prefers-reduced-motion: reduce) { .sk { animation: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2.5 2-2.5 3.5"/><path d="M12 15h.01"/></svg>
    </div>
    <div class="title">
      <h1>ถามข้อมูลสินค้า</h1>
      <p>ค้นจากเอกสารสินค้าของบริษัท พร้อมหน้าเอกสารอ้างอิง</p>
    </div>
    <div id="who"></div>
    <a id="adminLink" class="top-link" href="admin.html" hidden>หน้าผู้ดูแล</a>
  </div>
</header>

<main>
  <div id="msg" class="panel" hidden></div>

  <div id="searchBox" class="panel" hidden>
    <div class="search-row">
      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="text" id="q" maxlength="200" autocomplete="off" enterkeyhint="search" placeholder="พิมพ์ชื่อสินค้า หรือรหัส 7 หลัก" aria-label="คำค้นหา">
        <button type="button" id="clearBtn" aria-label="ล้างคำค้น" hidden>&times;</button>
      </div>
      <button type="button" id="goBtn" class="btn">ค้นหา</button>
    </div>
    <div class="chips" id="chips">
      <span class="chips-label">ลองค้น:</span>
      <button type="button" class="chip">รถเข็น</button>
      <button type="button" class="chip">ที่นอนลม</button>
      <button type="button" class="chip">เครื่องพ่นยา</button>
      <button type="button" class="chip">เตียงไฟฟ้า</button>
      <button type="button" class="chip">วอคเกอร์</button>
    </div>
  </div>

  <div id="status" role="status" aria-live="polite"></div>
  <div id="results"></div>
  <div class="foot">ข้อมูลจากเอกสารสินค้าของบริษัทเท่านั้น ถ้าไม่พบ หมายถึงยังไม่มีในเอกสาร ไม่ได้แปลว่าบริษัทไม่มีขาย</div>
</main>

<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="ovText">
  <div id="ovBar">
    <div id="ovText"></div>
    <button type="button" id="ovClose">ปิด</button>
  </div>
  <div id="ovTabs" role="tablist" aria-label="ประเภทเอกสาร"></div>
  <div id="ovBody">
    <div id="ovStage">
      <img id="ovImg" alt="หน้าเอกสารสินค้า">
      <div id="ovErr" hidden>ลิงก์รูปหมดอายุ กรุณาค้นหาใหม่</div>
      <button type="button" id="ovPrev" class="ov-nav" aria-label="ก่อนหน้า"></button>
      <button type="button" id="ovNext" class="ov-nav" aria-label="ถัดไป"></button>
    </div>
  </div>
  <div id="ovStrip" aria-label="เอกสารทั้งหมดของรหัสนี้"></div>
</div>

<script>
(function () {
  var SUPABASE_URL = 'https://zuyqwkjvjuwykrdhzhwq.supabase.co';
  var TIMEOUT_MS = 15000;
  var STORE_KEY = 'pqa.session';
  var SVG_NS = 'http://www.w3.org/2000/svg';

  // BEGIN PURE
  function reasonMessage(reason) {
    if (reason === 'expired') return 'ลิงก์หมดอายุ กรุณากดเมนู ถามข้อมูลสินค้า ใน Job Tracker อีกครั้ง';
    if (reason === 'reused') return 'ลิงก์นี้ถูกใช้ไปแล้ว กรุณากดเมนูใน Job Tracker อีกครั้ง';
    if (reason === 'malformed' || reason === 'bad_signature') return 'ลิงก์ไม่ถูกต้อง กรุณากดเมนูใน Job Tracker อีกครั้ง';
    return 'ติดต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่อีกครั้ง';
  }
  function splitDetails(text) {
    if (typeof text !== 'string') return [];
    var out = [];
    var parts = text.split(' | ');
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i].trim();
      if (p) out.push(p);
    }
    return out;
  }
  function isSessionValid(stored, now) {
    if (!stored || typeof stored !== 'object') return false;
    if (typeof stored.session !== 'string' || !stored.session) return false;
    if (typeof stored.expiresAt !== 'number') return false;
    return stored.expiresAt > now;
  }
  function getSsoParam(search) {
    var v = new URLSearchParams(search).get('sso');
    return v ? v : null;
  }
  function cleanUrl(pathname, search, hash) {
    var params = new URLSearchParams(search);
    params.delete('sso');
    var rest = params.toString();
    return pathname + (rest ? '?' + rest : '') + (hash || '');
  }
  function isTrustedPageUrl(url, baseUrl) {
    if (typeof url !== 'string') return false;
    return url.indexOf(baseUrl + '/storage/v1/object/public/catalog-pages/') === 0;
  }
  function citationLine(c) {
    if (c.page === null || c.page === undefined) return 'ที่มา: ' + c.documentTitle;
    return 'ที่มา: ' + c.documentTitle + ' หน้า ' + c.page;
  }
  function initialOf(name) {
    var s = typeof name === 'string' ? name.trim() : '';
    return s ? s.charAt(0) : '?';
  }
  function limitMessage(n) {
    return 'วันนี้ถามครบ ' + n + ' ครั้งแล้ว ถามใหม่ได้พรุ่งนี้';
  }
  // Split an Answer into display lines; blank lines are kept as one empty entry (spacing).
  function answerLines(text) {
    if (typeof text !== 'string') return [];
    var raw = text.replace(/\r\n?/g, '\n').split('\n');
    var out = [];
    for (var i = 0; i < raw.length; i++) {
      var line = raw[i].trim();
      if (line) out.push(line);
      else if (out.length && out[out.length - 1] !== '') out.push('');
    }
    while (out.length && out[out.length - 1] === '') out.pop();
    return out;
  }
  function feedbackBody(logId, value) {
    return { logId: logId, value: value === -1 ? -1 : 1 };
  }
  // Cards named in the Answer come first; the rest are "other close matches".
  // No Answer, or an Answer that names none of the cards: every card stays in main.
  function splitByAnswer(items, answer) {
    var list = Array.isArray(items) ? items : [];
    if (typeof answer !== 'string') return { main: list, other: [] };
    var codes = answer.match(/[0-9]{7}/g) || [];
    var main = [];
    var other = [];
    for (var i = 0; i < list.length; i++) {
      if (codes.indexOf(String(list[i].code)) !== -1) main.push(list[i]);
      else other.push(list[i]);
    }
    if (!main.length) return { main: list, other: [] };
    return { main: main, other: other };
  }

  // ---- Product Files (phase 3) ----
  var KIND_ORDER = ['photo', 'spec', 'shipping', 'promo', 'payment', 'cert', 'other'];
  var KIND_LABEL = {
    photo: 'รูปสินค้า', spec: 'รายละเอียด', shipping: 'ค่าขนส่ง', promo: 'โปรโมชัน',
    payment: 'QR ชำระเงิน', cert: 'ใบรับรอง', other: 'เอกสาร'
  };
  var THAI_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  var IMAGE_ERROR_TEXT = 'ลิงก์รูปหมดอายุ กรุณาค้นหาใหม่';

  // 'YYYY-MM-DD' -> '4 ก.ค. 2570' (Buddhist year). Anything else -> ''.
  function thaiDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(typeof iso === 'string' ? iso : '');
    if (!m) return '';
    var month = parseInt(m[2], 10);
    var day = parseInt(m[3], 10);
    if (month < 1 || month > 12 || day < 1 || day > 31) return '';
    return day + ' ' + THAI_MONTHS[month - 1] + ' ' + (parseInt(m[1], 10) + 543);
  }
  function kindLabel(kind) {
    return KIND_LABEL[kind] || KIND_LABEL.other;
  }
  function kindOf(kind) {
    return KIND_ORDER.indexOf(kind) === -1 ? 'other' : kind;
  }
  // Keep only well-formed Product Files; unknown kinds become 'other'. Server order (seq) is kept.
  function normalizeFiles(files) {
    if (!Array.isArray(files)) return [];
    var out = [];
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      if (!f || typeof f !== 'object') continue;
      out.push({
        id: f.id,
        kind: kindOf(f.kind),
        title: typeof f.title === 'string' && f.title ? f.title : kindLabel(kindOf(f.kind)),
        url: typeof f.url === 'string' ? f.url : null,
        thumbUrl: typeof f.thumbUrl === 'string' ? f.thumbUrl : null
      });
    }
    return out;
  }
  // One entry per kind present, in KIND_ORDER: { kind, label, count }.
  function groupFiles(files) {
    var list = normalizeFiles(files);
    var out = [];
    for (var k = 0; k < KIND_ORDER.length; k++) {
      var n = 0;
      for (var i = 0; i < list.length; i++) if (list[i].kind === KIND_ORDER[k]) n++;
      if (n) out.push({ kind: KIND_ORDER[k], label: kindLabel(KIND_ORDER[k]), count: n });
    }
    return out;
  }
  function chipLabel(label, count) {
    return count > 1 ? label + ' ' + count : label;
  }
  function catalogLabel(page) {
    return 'แคตตาล็อก หน้า ' + page;
  }
  function fileCountLabel(n) {
    return n + ' ไฟล์';
  }
  // Certificate banner text and tone, or null when there is no usable certificate.
  function certBanner(cert) {
    if (!cert || typeof cert !== 'object') return null;
    var heads = { expired: 'ใบรับรองหมดอายุแล้ว', expiring: 'ใบรับรองใกล้หมดอายุ', valid: 'ใบรับรองใช้ได้' };
    var tones = { expired: 'err', expiring: 'warn', valid: 'ok' };
    if (!heads[cert.status]) return null;
    var parts = [];
    if (cert.title) parts.push(String(cert.title));
    if (cert.certNo) parts.push('เลขที่ ' + cert.certNo);
    var until = thaiDate(cert.validUntil);
    if (until) parts.push('ใช้ได้ถึง ' + until);
    return {
      tone: tones[cert.status],
      head: heads[cert.status],
      detail: parts.join(' · '),
      note: cert.status === 'expired' ? 'โปรดขอใบใหม่ก่อนแจ้งลูกค้า' : ''
    };
  }
  // Viewer entries for one card: the catalog page first, then Product Files grouped by kind (seq order kept inside a kind).
  function viewerEntries(item) {
    var out = [];
    var c = item && item.citation;
    if (c && c.page !== null && c.page !== undefined) {
      out.push({ kind: 'catalog', title: c.documentTitle + ' หน้า ' + c.page, tab: catalogLabel(c.page), url: c.pageImageUrl || null, thumbUrl: c.pageImageUrl || null });
    }
    var list = normalizeFiles(item && item.files);
    for (var k = 0; k < KIND_ORDER.length; k++) {
      for (var i = 0; i < list.length; i++) {
        if (list[i].kind === KIND_ORDER[k]) out.push(list[i]);
      }
    }
    return out;
  }
  // Tabs for the viewer: { kind, label, index } with index = first entry of that kind.
  function viewerTabs(entries) {
    var tabs = [];
    for (var i = 0; i < entries.length; i++) {
      var e = entries[i];
      var found = -1;
      for (var t = 0; t < tabs.length; t++) if (tabs[t].kind === e.kind) found = t;
      if (found === -1) {
        tabs.push({ kind: e.kind, label: e.kind === 'catalog' ? e.tab : kindLabel(e.kind), index: i, count: 1 });
      } else {
        tabs[found].count++;
      }
    }
    for (var j = 0; j < tabs.length; j++) {
      if (tabs[j].kind !== 'catalog') tabs[j].label = chipLabel(tabs[j].label, tabs[j].count);
    }
    return tabs;
  }
  function startIndex(entries, kind) {
    for (var i = 0; i < entries.length; i++) if (entries[i].kind === kind) return i;
    return 0;
  }
  // Previous/next with wrap-around. dir is -1 or 1.
  function stepIndex(i, n, dir) {
    if (n <= 0) return 0;
    return (((i + dir) % n) + n) % n;
  }
  function viewerHeading(code, entry, i, n) {
    return code + ' · ' + entry.title + ' · ' + (i + 1) + ' จาก ' + n;
  }
  // Signed Product File URL from this project's storage, or a same-origin relative path (dev preview only).
  function isTrustedFileUrl(url, baseUrl) {
    if (typeof url !== 'string' || !url) return false;
    if (url.indexOf(baseUrl + '/storage/v1/object/sign/product-files/') === 0) return true;
    return !/^[a-z][a-z0-9+.\-]*:/i.test(url) && url.indexOf('//') !== 0 && url.indexOf('..') === -1;
  }
  // END PURE

  // Small inline icons, built node by node with createElementNS.
  var ICONS = {
    alert: [['path', 'M12 9v4'], ['path', 'M12 17h.01'], ['path', 'M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z']],
    info: [['circle', '12,12,10'], ['path', 'M12 16v-4'], ['path', 'M12 8h.01']],
    page: [['path', 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'], ['path', 'M14 2v6h6'], ['path', 'M8 13h8'], ['path', 'M8 17h5']],
    search: [['circle', '11,11,7'], ['path', 'M20 20l-3.5-3.5']],
    empty: [['circle', '11,11,7'], ['path', 'M20 20l-3.5-3.5'], ['path', 'M8.5 11h5']],
    chevronL: [['path', 'M15 18l-6-6 6-6']],
    chevronR: [['path', 'M9 18l6-6-6-6']],
    // lucide message-square-text, thumbs-up, thumbs-down
    answer: [['path', 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'], ['path', 'M13 8H7'], ['path', 'M17 12H7']],
    thumbUp: [['path', 'M7 10v12'], ['path', 'M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z']],
    thumbDown: [['path', 'M17 14V2'], ['path', 'M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z']]
  };
  function icon(name) {
    var svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '2');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    svg.setAttribute('aria-hidden', 'true');
    ICONS[name].forEach(function (d) {
      var el = document.createElementNS(SVG_NS, d[0]);
      if (d[0] === 'circle') {
        var c = d[1].split(',');
        el.setAttribute('cx', c[0]); el.setAttribute('cy', c[1]); el.setAttribute('r', c[2]);
      } else {
        el.setAttribute('d', d[1]);
      }
      svg.appendChild(el);
    });
    return svg;
  }

  var els = {
    who: document.getElementById('who'),
    adminLink: document.getElementById('adminLink'),
    msg: document.getElementById('msg'),
    box: document.getElementById('searchBox'),
    q: document.getElementById('q'),
    clear: document.getElementById('clearBtn'),
    go: document.getElementById('goBtn'),
    chips: document.getElementById('chips'),
    status: document.getElementById('status'),
    results: document.getElementById('results'),
    overlay: document.getElementById('overlay'),
    ovText: document.getElementById('ovText'),
    ovClose: document.getElementById('ovClose'),
    ovImg: document.getElementById('ovImg'),
    ovErr: document.getElementById('ovErr'),
    ovBody: document.getElementById('ovBody'),
    ovTabs: document.getElementById('ovTabs'),
    ovStrip: document.getElementById('ovStrip'),
    ovPrev: document.getElementById('ovPrev'),
    ovNext: document.getElementById('ovNext')
  };
  var current = null;
  var busy = false;
  var lastFocus = null;

  function addText(parent, tag, cls, text) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    el.textContent = text;
    parent.appendChild(el);
    return el;
  }

  function showMessage(text, isError) {
    els.msg.hidden = false;
    els.msg.className = 'panel ' + (isError ? 'error' : 'info');
    els.msg.textContent = '';
    var ic = icon(isError ? 'alert' : 'info');
    ic.setAttribute('class', 'msg-icon');
    els.msg.appendChild(ic);
    addText(els.msg, 'div', '', text);
  }
  function hideMessage() { els.msg.hidden = true; els.msg.textContent = ''; }

  function loadStored() {
    try {
      var raw = sessionStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function saveStored(obj) {
    try { sessionStorage.setItem(STORE_KEY, JSON.stringify(obj)); } catch (e) { /* storage blocked */ }
  }
  function clearStored() {
    try { sessionStorage.removeItem(STORE_KEY); } catch (e) { /* storage blocked */ }
  }

  function postJson(path, body, headers) {
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, TIMEOUT_MS);
    var h = { 'content-type': 'application/json' };
    if (headers) { for (var k in headers) { h[k] = headers[k]; } }
    return fetch(SUPABASE_URL + path, {
      method: 'POST',
      headers: h,
      body: JSON.stringify(body),
      cache: 'no-store',
      signal: controller.signal
    }).then(function (resp) {
      clearTimeout(timer);
      return resp.json().then(function (data) {
        return { status: resp.status, data: data };
      }, function () {
        return { status: resp.status, data: null };
      });
    }, function () {
      clearTimeout(timer);
      return { status: 0, data: null };
    });
  }

  function renderWho(sess) {
    els.who.textContent = '';
    var staff = sess.staff || {};
    addText(els.who, 'span', 'avatar', initialOf(staff.n));
    var t = document.createElement('span');
    t.className = 'who-text';
    var nm = addText(t, 'span', 'who-name', staff.n || '');
    if (sess.isAdmin) addText(nm, 'span', 'badge-admin', 'ผู้ดูแล');
    addText(t, 'span', 'who-unit', staff.un || '');
    els.who.appendChild(t);
    els.adminLink.hidden = !sess.isAdmin;
  }

  function showSearch(sess) {
    current = sess;
    hideMessage();
    renderWho(sess);
    els.box.hidden = false;
    els.q.focus();
  }
  function showNoSearch(text) {
    current = null;
    els.box.hidden = true;
    els.who.textContent = '';
    els.adminLink.hidden = true;
    els.results.textContent = '';
    els.status.textContent = '';
    showMessage(text, true);
  }

  function startSession() {
    var sso = getSsoParam(window.location.search);
    if (sso !== null) {
      try {
        history.replaceState(null, '', cleanUrl(window.location.pathname, window.location.search, window.location.hash));
      } catch (e) { /* ignore */ }
      showMessage('กำลังเข้าสู่ระบบ...', false);
      postJson('/functions/v1/session', { link: sso }).then(function (r) {
        if (r.status === 200 && r.data && typeof r.data.session === 'string') {
          var sess = {
            session: r.data.session,
            staff: r.data.staff || {},
            isAdmin: !!r.data.isAdmin,
            expiresAt: r.data.expiresAt
          };
          saveStored(sess);
          showSearch(sess);
        } else if (r.status === 401) {
          showNoSearch(reasonMessage(r.data && r.data.error));
        } else {
          showNoSearch(reasonMessage('network'));
        }
      });
      return;
    }
    var stored = loadStored();
    if (isSessionValid(stored, Date.now()) && stored.staff) {
      showSearch(stored);
    } else {
      clearStored();
      showNoSearch('กรุณาเปิดจากเมนู ถามข้อมูลสินค้า ใน Job Tracker');
    }
  }

  function copyCode(code, btn) {
    function done() {
      btn.textContent = 'คัดลอกแล้ว';
      btn.className = 'copy done';
      setTimeout(function () { btn.textContent = 'คัดลอกรหัส'; btn.className = 'copy'; }, 1500);
    }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = code;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { /* ignore */ }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done, fallback);
    } else {
      fallback();
    }
  }

  function renderSkeleton() {
    els.results.textContent = '';
    for (var i = 0; i < 2; i++) {
      var s = document.createElement('div');
      s.className = 'skeleton';
      addText(s, 'div', 'sk w30', '');
      addText(s, 'div', 'sk w70', '');
      addText(s, 'div', 'sk w50', '');
      els.results.appendChild(s);
    }
  }

  function renderAnswer(text) {
    var box = document.createElement('div');
    box.className = 'answer';
    var label = addText(box, 'div', 'answer-label', '');
    label.appendChild(icon('answer'));
    addText(label, 'span', '', 'คำตอบ');
    var body = document.createElement('div');
    body.className = 'answer-text';
    answerLines(text).forEach(function (line) {
      if (line === '') addText(body, 'p', 'gap', '');
      else addText(body, 'p', '', line);
    });
    box.appendChild(body);
    addText(box, 'div', 'answer-note', 'สรุปจากเอกสารด้านล่าง ตรวจสอบกับหน้าเอกสารก่อนแจ้งลูกค้า');
    return box;
  }

  function renderFeedback(logId) {
    var row = document.createElement('div');
    row.className = 'fb';
    addText(row, 'span', '', 'ข้อมูลนี้ถูกต้องไหม');
    var up = addText(row, 'button', 'fb-btn', '');
    var down = addText(row, 'button', 'fb-btn', '');
    up.type = 'button';
    down.type = 'button';
    up.appendChild(icon('thumbUp'));
    addText(up, 'span', '', 'ถูกต้อง');
    down.appendChild(icon('thumbDown'));
    addText(down, 'span', '', 'ไม่ถูกต้อง');
    var note = addText(row, 'span', '', '');
    var chosen = 0;
    function paint() {
      up.className = 'fb-btn' + (chosen === 1 ? ' sel' : '');
      down.className = 'fb-btn' + (chosen === -1 ? ' sel' : '');
    }
    function send(value) {
      if (!current || up.disabled) return;
      up.disabled = true;
      down.disabled = true;
      note.className = '';
      note.textContent = '';
      postJson('/functions/v1/feedback', feedbackBody(logId, value), { 'x-pqa-session': current.session }).then(function (r) {
        up.disabled = false;
        down.disabled = false;
        if (r.status === 200 && r.data && r.data.ok) {
          chosen = value;
          paint();
          note.className = 'fb-thanks';
          note.textContent = 'ขอบคุณสำหรับความเห็น';
        } else {
          note.className = 'fb-err';
          note.textContent = 'ส่งความเห็นไม่สำเร็จ';
        }
      });
    }
    up.addEventListener('click', function () { send(1); });
    down.addEventListener('click', function () { send(-1); });
    return row;
  }

  function hasLogId(data) {
    return data && typeof data.logId === 'number' && isFinite(data.logId);
  }

  function renderResults(data) {
    els.results.textContent = '';
    var items = data && Array.isArray(data.items) ? data.items : [];
    if (data && data.notInCatalog || items.length === 0) {
      els.status.textContent = '';
      var none = document.createElement('div');
      none.className = 'card empty';
      none.appendChild(icon('empty'));
      addText(none, 'div', 'empty-title', 'ไม่พบในเอกสารสินค้า');
      addText(none, 'div', 'hint', 'ลองพิมพ์คำอื่น หรือใช้รหัสสินค้า 7 หลัก');
      els.results.appendChild(none);
      return;
    }
    els.status.textContent = 'พบ ' + items.length + ' รายการ';
    var hasAnswer = typeof data.answer === 'string' && data.answer.trim() !== '';
    if (hasAnswer) els.results.appendChild(renderAnswer(data.answer));
    if (hasAnswer && hasLogId(data)) els.results.appendChild(renderFeedback(data.logId));
    var parts = splitByAnswer(items, hasAnswer ? data.answer : null);
    var marked = parts.other.length > 0;
    parts.main.forEach(function (it, idx) {
      els.results.appendChild(makeCard(it, marked));
      if (idx === 0 && !hasAnswer && hasLogId(data)) els.results.appendChild(renderFeedback(data.logId));
    });
    if (parts.other.length) {
      var more = document.createElement('details');
      more.className = 'more';
      addText(more, 'summary', '', 'รายการใกล้เคียงอื่น (' + parts.other.length + ')');
      addText(more, 'div', 'more-note', 'ไม่อยู่ในคำตอบ อาจไม่ตรงกับที่ถาม');
      parts.other.forEach(function (it) { more.appendChild(makeCard(it, false)); });
      els.results.appendChild(more);
    }
  }

  function makeDocChip(kind, label, it) {
    var chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'doc k-' + kind;
    addText(chip, 'i', '', '');
    addText(chip, 'span', '', label);
    chip.addEventListener('click', function () { openViewer(it, kind); });
    return chip;
  }

  function makeCard(it, inAnswer) {
      var card = document.createElement('div');
      card.className = 'card';
      var head = document.createElement('div');
      head.className = 'card-head';
      var code = String(it.code);
      addText(head, 'span', 'code', code);
      if (inAnswer) addText(head, 'span', 'in-answer', 'อยู่ในคำตอบ');
      var cp = addText(head, 'button', 'copy', 'คัดลอกรหัส');
      cp.type = 'button';
      cp.addEventListener('click', function () { copyCode(code, cp); });
      card.appendChild(head);
      var files = normalizeFiles(it.files);
      var body = document.createElement('div');
      body.className = 'body';
      if (isTrustedFileUrl(it.photoUrl, SUPABASE_URL)) {
        var th = document.createElement('button');
        th.type = 'button';
        th.className = 'thumb';
        th.setAttribute('aria-label', 'ดูรูปสินค้า ' + code);
        var timg = document.createElement('img');
        timg.alt = '';
        timg.onerror = function () { th.hidden = true; };
        timg.src = it.photoUrl;
        th.appendChild(timg);
        if (files.length) addText(th, 'span', 'count', fileCountLabel(files.length));
        th.addEventListener('click', function () { openViewer(it, 'photo'); });
        body.appendChild(th);
      }
      var info = document.createElement('div');
      info.className = 'info';
      addText(info, 'div', 'name', String(it.name));
      var lines = splitDetails(it.details);
      if (lines.length) {
        var ul = document.createElement('ul');
        ul.className = 'details';
        lines.forEach(function (line) { addText(ul, 'li', '', line); });
        info.appendChild(ul);
      }
      body.appendChild(info);
      card.appendChild(body);
      if (it.duplicateCode) {
        var dup = document.createElement('div');
        dup.className = 'dup';
        dup.appendChild(icon('alert'));
        addText(dup, 'span', '', 'รหัสนี้พบมากกว่า 1 รายการในเอกสาร โปรดตรวจสอบ');
        card.appendChild(dup);
      }
      var banner = certBanner(it.cert);
      if (banner) {
        var cb = document.createElement('div');
        cb.className = 'cert ' + banner.tone;
        addText(cb, 'span', 'cert-dot', '');
        var cbText = document.createElement('div');
        addText(cbText, 'b', '', banner.head);
        if (banner.detail) addText(cbText, 'div', '', banner.detail);
        if (banner.note) addText(cbText, 'div', '', banner.note);
        cb.appendChild(cbText);
        card.appendChild(cb);
      }
      var hasPage = it.citation && it.citation.page !== null && it.citation.page !== undefined;
      var groups = groupFiles(files);
      if (hasPage || groups.length) {
        var docs = document.createElement('div');
        docs.className = 'docs';
        if (hasPage) docs.appendChild(makeDocChip('catalog', catalogLabel(it.citation.page), it));
        groups.forEach(function (g) { docs.appendChild(makeDocChip(g.kind, chipLabel(g.label, g.count), it)); });
        card.appendChild(docs);
      }
      if (hasPage) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'cite';
        btn.appendChild(icon('page'));
        addText(btn, 'span', 'cite-text', citationLine(it.citation));
        addText(btn, 'span', 'cite-go', 'ดูหน้าเอกสาร');
        btn.addEventListener('click', function () { openViewer(it, 'catalog'); });
        card.appendChild(btn);
      }
      return card;
  }

  function doSearch() {
    if (busy || !current) return;
    var q = els.q.value.trim();
    if (!q) return;
    if (q.length > 200) q = q.slice(0, 200);
    if (!isSessionValid(current, Date.now())) {
      clearStored();
      showNoSearch(reasonMessage('expired'));
      return;
    }
    busy = true;
    els.go.disabled = true;
    els.status.textContent = 'กำลังค้นหา...';
    renderSkeleton();
    postJson('/functions/v1/search', { q: q }, { 'x-pqa-session': current.session }).then(function (r) {
      busy = false;
      els.go.disabled = false;
      els.status.textContent = '';
      if (r.status === 200 && r.data) {
        hideMessage();
        renderResults(r.data);
      } else if (r.status === 401) {
        clearStored();
        showNoSearch(reasonMessage('expired'));
      } else if (r.status === 429 && r.data && r.data.error === 'daily_limit') {
        els.results.textContent = '';
        showMessage(limitMessage(r.data.limit), true);
      } else {
        els.results.textContent = '';
        showMessage(reasonMessage('network'), true);
      }
    });
  }

  // The viewer shows every image of one card: catalog page first, then Product Files by kind.
  var viewer = null; // { code, entries, tabs, index }

  function entryUrlOk(e) {
    if (e.kind === 'catalog') return isTrustedPageUrl(e.url, SUPABASE_URL);
    return isTrustedFileUrl(e.url, SUPABASE_URL);
  }
  function showEntry(i) {
    var v = viewer;
    if (!v) return;
    v.index = i;
    var e = v.entries[i];
    els.ovText.textContent = viewerHeading(v.code, e, i, v.entries.length);
    els.ovErr.hidden = true;
    els.ovImg.hidden = false;
    els.ovImg.alt = e.title;
    if (entryUrlOk(e)) {
      els.ovImg.onerror = function () { els.ovImg.hidden = true; els.ovErr.textContent = IMAGE_ERROR_TEXT; els.ovErr.hidden = false; };
      els.ovImg.src = e.url;
    } else {
      els.ovImg.onerror = null;
      els.ovImg.removeAttribute('src');
      els.ovImg.hidden = true;
      els.ovErr.textContent = IMAGE_ERROR_TEXT;
      els.ovErr.hidden = false;
    }
    var tabBtns = els.ovTabs.children;
    for (var t = 0; t < tabBtns.length; t++) {
      tabBtns[t].setAttribute('aria-selected', v.tabs[t].kind === e.kind ? 'true' : 'false');
    }
    var thumbs = els.ovStrip.children;
    for (var s = 0; s < thumbs.length; s++) {
      if (s === i) thumbs[s].setAttribute('aria-current', 'true');
      else thumbs[s].removeAttribute('aria-current');
    }
    try { thumbs[i].scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (err) { /* older engines */ }
    els.ovBody.scrollTop = 0;
  }
  function buildViewer(item) {
    var entries = viewerEntries(item);
    var tabs = viewerTabs(entries);
    viewer = { code: String(item.code), entries: entries, tabs: tabs, index: 0 };
    els.ovTabs.textContent = '';
    tabs.forEach(function (tab) {
      var b = addText(els.ovTabs, 'button', 'ov-tab', tab.label);
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.addEventListener('click', function () { showEntry(tab.index); });
    });
    els.ovStrip.textContent = '';
    entries.forEach(function (e, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'ov-thumb';
      b.setAttribute('aria-label', e.title);
      var turl = e.thumbUrl;
      if (e.kind === 'catalog' ? isTrustedPageUrl(turl, SUPABASE_URL) : isTrustedFileUrl(turl, SUPABASE_URL)) {
        var im = document.createElement('img');
        im.alt = '';
        im.loading = 'lazy';
        im.onerror = function () { im.hidden = true; b.textContent = String(i + 1); };
        im.src = turl;
        b.appendChild(im);
      } else {
        b.textContent = String(i + 1);
      }
      b.addEventListener('click', function () { showEntry(i); });
      els.ovStrip.appendChild(b);
    });
    var multi = entries.length > 1;
    els.ovPrev.hidden = !multi;
    els.ovNext.hidden = !multi;
    els.ovTabs.hidden = tabs.length < 1;
    els.ovStrip.hidden = !multi;
  }
  function openViewer(item, kind) {
    buildViewer(item);
    if (!viewer.entries.length) { viewer = null; return; }
    lastFocus = document.activeElement;
    els.overlay.className = 'open';
    document.body.style.overflow = 'hidden';
    showEntry(startIndex(viewer.entries, kind));
    els.ovClose.focus();
  }
  function stepViewer(dir) {
    if (!viewer || viewer.entries.length < 2) return;
    showEntry(stepIndex(viewer.index, viewer.entries.length, dir));
  }
  function closeOverlay() {
    els.overlay.className = '';
    document.body.style.overflow = '';
    els.ovImg.onerror = null;
    els.ovImg.removeAttribute('src');
    viewer = null;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  function syncClear() { els.clear.hidden = els.q.value === ''; }

  els.go.addEventListener('click', doSearch);
  els.q.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
  });
  els.q.addEventListener('input', syncClear);
  els.clear.addEventListener('click', function () {
    els.q.value = '';
    syncClear();
    els.results.textContent = '';
    els.status.textContent = '';
    els.q.focus();
  });
  els.chips.addEventListener('click', function (e) {
    var t = e.target;
    if (t && t.className === 'chip') {
      els.q.value = t.textContent;
      syncClear();
      doSearch();
    }
  });
  els.ovClose.addEventListener('click', closeOverlay);
  els.ovPrev.addEventListener('click', function () { stepViewer(-1); });
  els.ovNext.addEventListener('click', function () { stepViewer(1); });
  els.ovPrev.appendChild(icon('chevronL'));
  els.ovNext.appendChild(icon('chevronR'));
  els.overlay.addEventListener('click', function (e) {
    if (e.target === els.overlay || e.target.id === 'ovBody' || e.target.id === 'ovStage') closeOverlay();
  });
  document.addEventListener('keydown', function (e) {
    if (els.overlay.className !== 'open') return;
    if (e.key === 'Escape') closeOverlay();
    else if (e.key === 'ArrowLeft') { e.preventDefault(); stepViewer(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); stepViewer(1); }
  });

  startSession();
})();
</script>
</body>
</html>
