<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1849a9">
<title>ถามข้อมูลสินค้า</title>
<style>
  :root {
    --brand: #1a5fd0;
    --brand-dark: #1849a9;
    --brand-soft: #eaf1fd;
    --ink: #172033;
    --ink-2: #475069;
    --ink-3: #7a8399;
    --line: #e2e6ee;
    --bg: #f3f5f9;
    --card: #ffffff;
    --warn-bg: #fff6e0;
    --warn-line: #f0c95c;
    --warn-ink: #7a5300;
    --err: #b3261e;
    --ok: #1f8a4c;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(23, 32, 51, 0.06), 0 4px 14px rgba(23, 32, 51, 0.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Leelawadee UI", "Leelawadee", Tahoma, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }
  button, input { font-family: inherit; }
  [hidden] { display: none !important; }

  /* ---------- header ---------- */
  .top {
    background: linear-gradient(120deg, #1849a9 0%, #1a5fd0 55%, #3b82f6 100%);
    color: #fff;
    padding: 18px 16px 64px;
  }
  .top-inner { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 42px; height: 42px; flex: 0 0 42px;
    border-radius: 12px; background: rgba(255, 255, 255, 0.18);
    display: flex; align-items: center; justify-content: center;
  }
  .logo svg { width: 24px; height: 24px; }
  .title { flex: 1; min-width: 0; }
  .title h1 { font-size: 1.25rem; margin: 0; line-height: 1.3; }
  .title p { margin: 0; font-size: 0.85rem; opacity: 0.85; }
  #who {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255, 255, 255, 0.16); border-radius: 999px;
    padding: 5px 12px 5px 5px; font-size: 0.85rem; max-width: 52%;
  }
  #who:empty { display: none; }
  .avatar {
    width: 28px; height: 28px; flex: 0 0 28px; border-radius: 50%;
    background: #fff; color: var(--brand-dark); font-weight: bold;
    display: flex; align-items: center; justify-content: center; font-size: 0.85rem;
  }
  .who-text { min-width: 0; line-height: 1.25; }
  .who-name, .who-unit { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who-unit { opacity: 0.85; font-size: 0.78rem; }
  .badge-admin {
    font-size: 0.7rem; background: #ffd75e; color: #4a3500;
    border-radius: 999px; padding: 1px 7px; margin-left: 4px; font-weight: bold;
  }

  /* ---------- body ---------- */
  main { max-width: 720px; margin: -44px auto 0; padding: 0 16px 40px; }
  .panel {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 16px;
  }
  #msg { margin-bottom: 14px; display: flex; gap: 10px; align-items: flex-start; }
  #msg .msg-icon { flex: 0 0 22px; width: 22px; height: 22px; margin-top: 1px; }
  #msg.error { color: var(--err); font-weight: bold; }
  #msg.info { color: var(--ink-2); }

  #searchBox { margin-bottom: 16px; }
  .search-row { display: flex; gap: 10px; }
  .field { position: relative; flex: 1; min-width: 0; }
  .field svg {
    position: absolute; left: 14px; top: 50%; width: 20px; height: 20px;
    margin-top: -10px; color: var(--ink-3); pointer-events: none;
  }
  #q {
    width: 100%; padding: 13px 40px 13px 44px; font-size: 1.05rem;
    border: 1.5px solid var(--line); border-radius: 12px; background: #fbfcfe; color: var(--ink);
    outline: none; transition: border-color 0.15s, box-shadow 0.15s;
  }
  #q:focus { border-color: var(--brand); background: #fff; box-shadow: 0 0 0 4px rgba(26, 95, 208, 0.14); }
  #q::placeholder { color: var(--ink-3); }
  #clearBtn {
    position: absolute; right: 8px; top: 50%; margin-top: -15px; width: 30px; height: 30px;
    border: 0; border-radius: 50%; background: transparent; color: var(--ink-3); cursor: pointer;
    font-size: 1.1rem; line-height: 30px; padding: 0;
  }
  #clearBtn:hover { background: var(--bg); color: var(--ink); }
  #goBtn {
    padding: 0 22px; font-size: 1.05rem; font-weight: bold; border: 0; border-radius: 12px;
    background: var(--brand); color: #fff; cursor: pointer; white-space: nowrap;
    transition: background 0.15s;
  }
  #goBtn:hover { background: var(--brand-dark); }
  #goBtn:disabled { background: #9aa8c4; cursor: default; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  .chips-label { font-size: 0.85rem; color: var(--ink-3); margin-right: 2px; }
  .chip {
    border: 1px solid var(--line); background: #fff; color: var(--ink-2);
    border-radius: 999px; padding: 4px 12px; font-size: 0.88rem; cursor: pointer;
  }
  .chip:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }

  #status { color: var(--ink-3); font-size: 0.9rem; margin: 0 4px 10px; min-height: 1.4em; }

  /* ---------- result cards ---------- */
  .card {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 16px; margin-bottom: 12px; border: 1px solid transparent;
  }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  .code {
    font-family: Consolas, "Courier New", monospace; font-size: 1.35rem; font-weight: bold;
    letter-spacing: 1.5px; color: var(--brand-dark); background: var(--brand-soft);
    border-radius: 8px; padding: 2px 10px;
  }
  .copy {
    border: 1px solid var(--line); background: #fff; color: var(--ink-2); border-radius: 8px;
    padding: 4px 10px; font-size: 0.82rem; cursor: pointer;
  }
  .copy:hover { border-color: var(--brand); color: var(--brand); }
  .copy.done { border-color: var(--ok); color: var(--ok); }
  .name { font-size: 1.08rem; font-weight: bold; margin: 2px 0 8px; color: var(--ink); }
  .details { list-style: none; margin: 0; padding: 0; }
  .details li {
    position: relative; padding-left: 24px; font-size: 0.95rem; color: var(--ink-2); margin: 3px 0;
  }
  .details li::before {
    content: ""; position: absolute; left: 2px; top: 0.38em; width: 14px; height: 14px;
    border-radius: 4px; background: var(--brand-soft);
    box-shadow: inset 0 0 0 1.5px #9dbcf0;
  }
  .details li::after {
    content: ""; position: absolute; left: 6px; top: 0.52em; width: 6px; height: 3px;
    border-left: 2px solid var(--brand); border-bottom: 2px solid var(--brand);
    transform: rotate(-45deg);
  }
  .dup {
    display: flex; gap: 8px; align-items: flex-start;
    margin-top: 12px; padding: 8px 10px; background: var(--warn-bg); border: 1px solid var(--warn-line);
    border-radius: 10px; color: var(--warn-ink); font-size: 0.88rem;
  }
  .dup svg { flex: 0 0 18px; width: 18px; height: 18px; margin-top: 1px; }
  .cite {
    display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 12px; padding: 10px 12px;
    text-align: left; font-size: 0.9rem; border: 1px solid #c9daf8; border-radius: 10px;
    background: #f6f9ff; color: var(--brand-dark); cursor: pointer;
  }
  .cite:hover { background: var(--brand-soft); border-color: var(--brand); }
  .cite svg { flex: 0 0 20px; width: 20px; height: 20px; }
  .cite-text { flex: 1; min-width: 0; }
  .cite-go { font-weight: bold; white-space: nowrap; }

  .empty { text-align: center; padding: 28px 16px; }
  .empty svg { width: 64px; height: 64px; color: #b9c6de; }
  .empty .empty-title { font-size: 1.08rem; font-weight: bold; margin-top: 8px; color: var(--ink); }
  .empty .hint { color: var(--ink-3); font-size: 0.92rem; margin-top: 4px; }

  .skeleton { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; }
  .sk { height: 12px; border-radius: 6px; margin: 8px 0; background: linear-gradient(90deg, #edf0f5 25%, #f6f8fb 50%, #edf0f5 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
  .sk.w30 { width: 30%; height: 22px; } .sk.w70 { width: 70%; } .sk.w50 { width: 50%; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  .foot { text-align: center; color: var(--ink-3); font-size: 0.8rem; margin-top: 18px; }

  /* ---------- page image viewer ---------- */
  #overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(12, 16, 26, 0.96); z-index: 10; flex-direction: column;
  }
  #overlay.open { display: flex; }
  #ovBar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #121826; color: #fff; }
  #ovText { flex: 1; min-width: 0; font-size: 0.92rem; }
  #ovClose {
    padding: 8px 16px; font-size: 0.95rem; border: 0; border-radius: 10px;
    background: #fff; color: var(--ink); cursor: pointer; font-weight: bold;
  }
  #ovBody { flex: 1; overflow: auto; padding: 12px; }
  #ovImg { width: 100%; max-width: 1000px; height: auto; display: block; margin: 0 auto; border-radius: 8px; background: #fff; }
  #ovErr { color: #fff; padding: 24px 12px; text-align: center; }

  .title h1 { white-space: nowrap; }
  @media (max-width: 520px) {
    .top { padding: 14px 14px 58px; }
    .top-inner { flex-wrap: wrap; }
    .title p { display: none; }
    #who { order: 3; flex: 1 1 100%; max-width: 100%; }
    main { padding: 0 12px 32px; }
    .search-row { flex-direction: column; }
    #goBtn { padding: 12px; }
    .code { font-size: 1.2rem; }
  }
  @media (prefers-reduced-motion: reduce) { .sk { animation: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2.5 2-2.5 3.5"/><path d="M12 15h.01"/></svg>
    </div>
    <div class="title">
      <h1>ถามข้อมูลสินค้า</h1>
      <p>ค้นจากเอกสารสินค้าของบริษัท พร้อมหน้าเอกสารอ้างอิง</p>
    </div>
    <div id="who"></div>
  </div>
</header>

<main>
  <div id="msg" class="panel" hidden></div>

  <div id="searchBox" class="panel" hidden>
    <div class="search-row">
      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="text" id="q" maxlength="200" autocomplete="off" enterkeyhint="search" placeholder="พิมพ์ชื่อสินค้า หรือรหัส 7 หลัก" aria-label="คำค้นหา">
        <button type="button" id="clearBtn" aria-label="ล้างคำค้น" hidden>&times;</button>
      </div>
      <button type="button" id="goBtn">ค้นหา</button>
    </div>
    <div class="chips" id="chips">
      <span class="chips-label">ลองค้น:</span>
      <button type="button" class="chip">รถเข็น</button>
      <button type="button" class="chip">ที่นอนลม</button>
      <button type="button" class="chip">เครื่องพ่นยา</button>
      <button type="button" class="chip">เตียงไฟฟ้า</button>
      <button type="button" class="chip">วอคเกอร์</button>
    </div>
  </div>

  <div id="status" role="status" aria-live="polite"></div>
  <div id="results"></div>
  <div class="foot">ข้อมูลจากเอกสารสินค้าของบริษัทเท่านั้น ถ้าไม่พบ หมายถึงยังไม่มีในเอกสาร ไม่ได้แปลว่าบริษัทไม่มีขาย</div>
</main>

<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="ovText">
  <div id="ovBar">
    <div id="ovText"></div>
    <button type="button" id="ovClose">ปิด</button>
  </div>
  <div id="ovBody">
    <img id="ovImg" alt="หน้าเอกสารสินค้า">
    <div id="ovErr" hidden>โหลดรูปหน้าเอกสารไม่ได้</div>
  </div>
</div>

<script>
(function () {
  var SUPABASE_URL = 'https://zuyqwkjvjuwykrdhzhwq.supabase.co';
  var TIMEOUT_MS = 15000;
  var STORE_KEY = 'pqa.session';
  var SVG_NS = 'http://www.w3.org/2000/svg';

  // BEGIN PURE
  function reasonMessage(reason) {
    if (reason === 'expired') return 'ลิงก์หมดอายุ กรุณากดเมนู ถามข้อมูลสินค้า ใน Job Tracker อีกครั้ง';
    if (reason === 'reused') return 'ลิงก์นี้ถูกใช้ไปแล้ว กรุณากดเมนูใน Job Tracker อีกครั้ง';
    if (reason === 'malformed' || reason === 'bad_signature') return 'ลิงก์ไม่ถูกต้อง กรุณากดเมนูใน Job Tracker อีกครั้ง';
    return 'ติดต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่อีกครั้ง';
  }
  function splitDetails(text) {
    if (typeof text !== 'string') return [];
    var out = [];
    var parts = text.split(' | ');
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i].trim();
      if (p) out.push(p);
    }
    return out;
  }
  function isSessionValid(stored, now) {
    if (!stored || typeof stored !== 'object') return false;
    if (typeof stored.session !== 'string' || !stored.session) return false;
    if (typeof stored.expiresAt !== 'number') return false;
    return stored.expiresAt > now;
  }
  function getSsoParam(search) {
    var v = new URLSearchParams(search).get('sso');
    return v ? v : null;
  }
  function cleanUrl(pathname, search, hash) {
    var params = new URLSearchParams(search);
    params.delete('sso');
    var rest = params.toString();
    return pathname + (rest ? '?' + rest : '') + (hash || '');
  }
  function isTrustedPageUrl(url, baseUrl) {
    if (typeof url !== 'string') return false;
    return url.indexOf(baseUrl + '/storage/v1/object/public/catalog-pages/') === 0;
  }
  function citationLine(c) {
    return 'ที่มา: ' + c.documentTitle + ' หน้า ' + c.page;
  }
  function initialOf(name) {
    var s = typeof name === 'string' ? name.trim() : '';
    return s ? s.charAt(0) : '?';
  }
  // END PURE

  // Small inline icons, built node by node with createElementNS.
  var ICONS = {
    alert: [['path', 'M12 9v4'], ['path', 'M12 17h.01'], ['path', 'M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z']],
    info: [['circle', '12,12,10'], ['path', 'M12 16v-4'], ['path', 'M12 8h.01']],
    page: [['path', 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'], ['path', 'M14 2v6h6'], ['path', 'M8 13h8'], ['path', 'M8 17h5']],
    search: [['circle', '11,11,7'], ['path', 'M20 20l-3.5-3.5']],
    empty: [['circle', '11,11,7'], ['path', 'M20 20l-3.5-3.5'], ['path', 'M8.5 11h5']]
  };
  function icon(name) {
    var svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '2');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    svg.setAttribute('aria-hidden', 'true');
    ICONS[name].forEach(function (d) {
      var el = document.createElementNS(SVG_NS, d[0]);
      if (d[0] === 'circle') {
        var c = d[1].split(',');
        el.setAttribute('cx', c[0]); el.setAttribute('cy', c[1]); el.setAttribute('r', c[2]);
      } else {
        el.setAttribute('d', d[1]);
      }
      svg.appendChild(el);
    });
    return svg;
  }

  var els = {
    who: document.getElementById('who'),
    msg: document.getElementById('msg'),
    box: document.getElementById('searchBox'),
    q: document.getElementById('q'),
    clear: document.getElementById('clearBtn'),
    go: document.getElementById('goBtn'),
    chips: document.getElementById('chips'),
    status: document.getElementById('status'),
    results: document.getElementById('results'),
    overlay: document.getElementById('overlay'),
    ovText: document.getElementById('ovText'),
    ovClose: document.getElementById('ovClose'),
    ovImg: document.getElementById('ovImg'),
    ovErr: document.getElementById('ovErr')
  };
  var current = null;
  var busy = false;
  var lastFocus = null;

  function addText(parent, tag, cls, text) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    el.textContent = text;
    parent.appendChild(el);
    return el;
  }

  function showMessage(text, isError) {
    els.msg.hidden = false;
    els.msg.className = 'panel ' + (isError ? 'error' : 'info');
    els.msg.textContent = '';
    var ic = icon(isError ? 'alert' : 'info');
    ic.setAttribute('class', 'msg-icon');
    els.msg.appendChild(ic);
    addText(els.msg, 'div', '', text);
  }
  function hideMessage() { els.msg.hidden = true; els.msg.textContent = ''; }

  function loadStored() {
    try {
      var raw = sessionStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function saveStored(obj) {
    try { sessionStorage.setItem(STORE_KEY, JSON.stringify(obj)); } catch (e) { /* storage blocked */ }
  }
  function clearStored() {
    try { sessionStorage.removeItem(STORE_KEY); } catch (e) { /* storage blocked */ }
  }

  function postJson(path, body, headers) {
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, TIMEOUT_MS);
    var h = { 'content-type': 'application/json' };
    if (headers) { for (var k in headers) { h[k] = headers[k]; } }
    return fetch(SUPABASE_URL + path, {
      method: 'POST',
      headers: h,
      body: JSON.stringify(body),
      cache: 'no-store',
      signal: controller.signal
    }).then(function (resp) {
      clearTimeout(timer);
      return resp.json().then(function (data) {
        return { status: resp.status, data: data };
      }, function () {
        return { status: resp.status, data: null };
      });
    }, function () {
      clearTimeout(timer);
      return { status: 0, data: null };
    });
  }

  function renderWho(sess) {
    els.who.textContent = '';
    var staff = sess.staff || {};
    addText(els.who, 'span', 'avatar', initialOf(staff.n));
    var t = document.createElement('span');
    t.className = 'who-text';
    var nm = addText(t, 'span', 'who-name', staff.n || '');
    if (sess.isAdmin) addText(nm, 'span', 'badge-admin', 'ผู้ดูแล');
    addText(t, 'span', 'who-unit', staff.un || '');
    els.who.appendChild(t);
  }

  function showSearch(sess) {
    current = sess;
    hideMessage();
    renderWho(sess);
    els.box.hidden = false;
    els.q.focus();
  }
  function showNoSearch(text) {
    current = null;
    els.box.hidden = true;
    els.who.textContent = '';
    els.results.textContent = '';
    els.status.textContent = '';
    showMessage(text, true);
  }

  function startSession() {
    var sso = getSsoParam(window.location.search);
    if (sso !== null) {
      try {
        history.replaceState(null, '', cleanUrl(window.location.pathname, window.location.search, window.location.hash));
      } catch (e) { /* ignore */ }
      showMessage('กำลังเข้าสู่ระบบ...', false);
      postJson('/functions/v1/session', { link: sso }).then(function (r) {
        if (r.status === 200 && r.data && typeof r.data.session === 'string') {
          var sess = {
            session: r.data.session,
            staff: r.data.staff || {},
            isAdmin: !!r.data.isAdmin,
            expiresAt: r.data.expiresAt
          };
          saveStored(sess);
          showSearch(sess);
        } else if (r.status === 401) {
          showNoSearch(reasonMessage(r.data && r.data.error));
        } else {
          showNoSearch(reasonMessage('network'));
        }
      });
      return;
    }
    var stored = loadStored();
    if (isSessionValid(stored, Date.now()) && stored.staff) {
      showSearch(stored);
    } else {
      clearStored();
      showNoSearch('กรุณาเปิดจากเมนู ถามข้อมูลสินค้า ใน Job Tracker');
    }
  }

  function copyCode(code, btn) {
    function done() {
      btn.textContent = 'คัดลอกแล้ว';
      btn.className = 'copy done';
      setTimeout(function () { btn.textContent = 'คัดลอกรหัส'; btn.className = 'copy'; }, 1500);
    }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = code;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { /* ignore */ }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done, fallback);
    } else {
      fallback();
    }
  }

  function renderSkeleton() {
    els.results.textContent = '';
    for (var i = 0; i < 2; i++) {
      var s = document.createElement('div');
      s.className = 'skeleton';
      addText(s, 'div', 'sk w30', '');
      addText(s, 'div', 'sk w70', '');
      addText(s, 'div', 'sk w50', '');
      els.results.appendChild(s);
    }
  }

  function renderResults(data) {
    els.results.textContent = '';
    var items = data && Array.isArray(data.items) ? data.items : [];
    if (data && data.notInCatalog || items.length === 0) {
      els.status.textContent = '';
      var none = document.createElement('div');
      none.className = 'card empty';
      none.appendChild(icon('empty'));
      addText(none, 'div', 'empty-title', 'ไม่พบในเอกสารสินค้า');
      addText(none, 'div', 'hint', 'ลองพิมพ์คำอื่น หรือใช้รหัสสินค้า 7 หลัก');
      els.results.appendChild(none);
      return;
    }
    els.status.textContent = 'พบ ' + items.length + ' รายการ';
    items.forEach(function (it) {
      var card = document.createElement('div');
      card.className = 'card';
      var head = document.createElement('div');
      head.className = 'card-head';
      var code = String(it.code);
      addText(head, 'span', 'code', code);
      var cp = addText(head, 'button', 'copy', 'คัดลอกรหัส');
      cp.type = 'button';
      cp.addEventListener('click', function () { copyCode(code, cp); });
      card.appendChild(head);
      addText(card, 'div', 'name', String(it.name));
      var lines = splitDetails(it.details);
      if (lines.length) {
        var ul = document.createElement('ul');
        ul.className = 'details';
        lines.forEach(function (line) { addText(ul, 'li', '', line); });
        card.appendChild(ul);
      }
      if (it.duplicateCode) {
        var dup = document.createElement('div');
        dup.className = 'dup';
        dup.appendChild(icon('alert'));
        addText(dup, 'span', '', 'รหัสนี้พบมากกว่า 1 รายการในเอกสาร โปรดตรวจสอบ');
        card.appendChild(dup);
      }
      if (it.citation) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'cite';
        btn.appendChild(icon('page'));
        addText(btn, 'span', 'cite-text', citationLine(it.citation));
        addText(btn, 'span', 'cite-go', 'ดูหน้าเอกสาร');
        btn.addEventListener('click', function () { openOverlay(it.citation); });
        card.appendChild(btn);
      }
      els.results.appendChild(card);
    });
  }

  function doSearch() {
    if (busy || !current) return;
    var q = els.q.value.trim();
    if (!q) return;
    if (q.length > 200) q = q.slice(0, 200);
    if (!isSessionValid(current, Date.now())) {
      clearStored();
      showNoSearch(reasonMessage('expired'));
      return;
    }
    busy = true;
    els.go.disabled = true;
    els.status.textContent = 'กำลังค้นหา...';
    renderSkeleton();
    postJson('/functions/v1/search', { q: q }, { 'x-pqa-session': current.session }).then(function (r) {
      busy = false;
      els.go.disabled = false;
      els.status.textContent = '';
      if (r.status === 200 && r.data) {
        hideMessage();
        renderResults(r.data);
      } else if (r.status === 401) {
        clearStored();
        showNoSearch(reasonMessage('expired'));
      } else {
        els.results.textContent = '';
        showMessage(reasonMessage('network'), true);
      }
    });
  }

  function openOverlay(c) {
    lastFocus = document.activeElement;
    els.ovText.textContent = citationLine(c);
    els.ovErr.hidden = true;
    els.ovImg.hidden = false;
    if (isTrustedPageUrl(c.pageImageUrl, SUPABASE_URL)) {
      els.ovImg.onerror = function () { els.ovImg.hidden = true; els.ovErr.hidden = false; };
      els.ovImg.src = c.pageImageUrl;
    } else {
      els.ovImg.removeAttribute('src');
      els.ovImg.hidden = true;
      els.ovErr.hidden = false;
    }
    els.overlay.className = 'open';
    document.body.style.overflow = 'hidden';
    els.ovClose.focus();
  }
  function closeOverlay() {
    els.overlay.className = '';
    document.body.style.overflow = '';
    els.ovImg.onerror = null;
    els.ovImg.removeAttribute('src');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  function syncClear() { els.clear.hidden = els.q.value === ''; }

  els.go.addEventListener('click', doSearch);
  els.q.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
  });
  els.q.addEventListener('input', syncClear);
  els.clear.addEventListener('click', function () {
    els.q.value = '';
    syncClear();
    els.results.textContent = '';
    els.status.textContent = '';
    els.q.focus();
  });
  els.chips.addEventListener('click', function (e) {
    var t = e.target;
    if (t && t.className === 'chip') {
      els.q.value = t.textContent;
      syncClear();
      doSearch();
    }
  });
  els.ovClose.addEventListener('click', closeOverlay);
  els.overlay.addEventListener('click', function (e) {
    if (e.target === els.overlay || e.target.id === 'ovBody') closeOverlay();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && els.overlay.className === 'open') closeOverlay();
  });

  startSession();
})();
</script>
</body>
</html>
