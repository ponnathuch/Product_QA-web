<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ถามสินค้า / IT</title>
<link rel="stylesheet" href="pqa-theme.css?v=1">
<style>
  /* Page layout only. Colours, fonts, radii, spacing and focus come from pqa-theme.css tokens. */
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
  #app { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .top { padding: var(--space-3) var(--space-4); }
  .top-inner { max-width: var(--max-narrow); }
  .title h1 { font-size: var(--fs-l); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title p { font-size: var(--fs-xs); }
  button.top-link { border: 0; cursor: pointer; }
  #who {
    display: flex; align-items: center; gap: var(--space-2);
    background: var(--c-on-header-soft); border-radius: var(--radius-pill);
    padding: var(--space-1) var(--space-3) var(--space-1) var(--space-1); font-size: var(--fs-s); max-width: 34%;
  }
  #who:empty { display: none; }
  .avatar {
    width: var(--size-avatar); height: var(--size-avatar); flex: 0 0 var(--size-avatar); border-radius: 50%;
    background: var(--c-on-header); color: var(--c-header-1); font-weight: bold;
    display: flex; align-items: center; justify-content: center; font-size: var(--fs-s);
  }
  .who-text { min-width: 0; line-height: 1.25; }
  .who-name, .who-unit { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who-unit { opacity: 0.88; font-size: var(--fs-xs); }

  #notice { max-width: var(--max-narrow); width: 100%; margin: var(--space-3) auto 0; padding: 0 var(--space-4); }
  #msg { display: flex; gap: var(--space-3); align-items: flex-start; }
  #msg .msg-icon { flex: 0 0 var(--size-icon); width: var(--size-icon); height: var(--size-icon); margin-top: var(--space-0); }
  #msg.error { color: var(--c-err); font-weight: bold; }
  #msg.info { color: var(--c-ink-2); }
  #unsupported { max-width: var(--max-narrow); margin: var(--space-5) auto; padding: var(--space-4); }
  #unsupported p { margin: var(--space-2) 0 0; }

  /* ---------- thread ---------- */
  #thread { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: var(--space-4) var(--space-4) var(--space-3); }
  .thread-in { max-width: var(--max-narrow); margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-3); }
  .intro { text-align: center; padding: var(--space-5) var(--space-4); color: var(--c-ink-3); }
  .intro svg { width: var(--size-empty); height: var(--size-empty); color: var(--c-line-strong); }
  .intro .intro-title { font-size: var(--fs-l); font-weight: bold; color: var(--c-ink); margin-top: var(--space-2); }
  .intro p { margin: var(--space-1) 0 0; font-size: var(--fs-s); }
  .turn { display: flex; flex-direction: column; gap: var(--space-2); }
  .row-user { align-self: flex-end; max-width: 88%; display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-2); }
  .row-sys { align-self: flex-start; width: 100%; max-width: 100%; display: flex; flex-direction: column; gap: var(--space-2); }
  .bubble { border-radius: var(--radius-l); padding: var(--space-3) var(--space-4); word-break: break-word; overflow-wrap: anywhere; }
  .bubble p { margin: 0 0 var(--space-2); font-size: var(--fs-m); }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble p.gap { height: 0.6em; margin: 0; }
  .b-user { background: var(--c-brand); color: var(--c-on-brand); border-bottom-right-radius: var(--space-1); }
  .b-sys { background: var(--c-surface); color: var(--c-ink); border: 1px solid var(--c-line); box-shadow: var(--shadow-1); border-bottom-left-radius: var(--space-1); max-width: 94%; }
  .b-sys.error { background: var(--c-err-soft); border-color: var(--c-err-line); color: var(--c-err); }
  .b-sys.wait { color: var(--c-ink-3); }
  .b-sys.wait::before {
    content: ""; display: inline-block; width: var(--space-2); height: var(--space-2); margin-right: var(--space-2);
    border-radius: 50%; background: var(--c-brand); animation: pulse var(--dur-shimmer) infinite ease-in-out;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  .user-pics { display: flex; gap: var(--space-2); flex-wrap: wrap; justify-content: flex-end; }
  .user-pics img { width: var(--size-strip-h); height: var(--size-strip-h); object-fit: cover; border-radius: var(--radius-s); border: 1px solid var(--c-line); background: var(--c-img-backing); }

  .pic-text { max-width: 100%; background: var(--c-surface-2); border: 1px dashed var(--c-line-strong); border-radius: var(--radius-m); padding: var(--space-2) var(--space-3); font-size: var(--fs-s); color: var(--c-ink-2); }
  .pic-text b { display: block; color: var(--c-ink); }
  .pic-text .pic-body { white-space: pre-wrap; margin: var(--space-1) 0 var(--space-2); }
  .pic-text textarea { width: 100%; min-height: calc(var(--size-target-lg) * 2); padding: var(--space-2) var(--space-3); border: 1px solid var(--c-line-strong); border-radius: var(--radius-s); background: var(--c-surface); color: var(--c-ink); font-size: var(--fs-s); resize: vertical; }
  .btn-row { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-2); }
  .btn.small { min-height: var(--size-target); padding: var(--space-1) var(--space-3); font-size: var(--fs-s); }

  .topic-wrap { position: relative; display: inline-block; margin-bottom: var(--space-2); }
  .topic-btn {
    display: inline-flex; align-items: center; gap: var(--space-1); min-height: var(--size-target);
    border: 1px solid var(--c-brand-line); background: var(--c-surface-2); color: var(--c-brand-strong);
    border-radius: var(--radius-pill); padding: var(--space-1) var(--space-3); font-size: var(--fs-xs); cursor: pointer;
  }
  .topic-btn:hover { background: var(--c-brand-soft); border-color: var(--c-brand); }
  .topic-btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .topic-btn svg { width: var(--size-icon-s); height: var(--size-icon-s); }
  .topic-menu {
    position: absolute; left: 0; top: 100%; z-index: 5; min-width: calc(var(--size-field)); margin-top: var(--space-1);
    background: var(--c-surface); border: 1px solid var(--c-line-strong); border-radius: var(--radius-m);
    box-shadow: var(--shadow-1); padding: var(--space-1); display: flex; flex-direction: column;
  }
  .topic-menu button {
    min-height: var(--size-target); text-align: left; border: 0; background: transparent; color: var(--c-ink);
    border-radius: var(--radius-s); padding: var(--space-1) var(--space-3); font-size: var(--fs-s); cursor: pointer;
  }
  .topic-menu button:hover { background: var(--c-brand-soft); }
  .topic-menu button[aria-checked="true"] { font-weight: bold; color: var(--c-brand-strong); }
  .menu-hint { padding: var(--space-1) var(--space-3); font-size: var(--fs-xs); color: var(--c-ink-3); }

  .src { margin-top: var(--space-3); padding-top: var(--space-2); border-top: 1px solid var(--c-line); font-size: var(--fs-s); color: var(--c-ink-2); }
  .src b { color: var(--c-ink); }
  .src ul { margin: var(--space-1) 0 0; padding-left: var(--space-5); }
  .note-box {
    display: flex; gap: var(--space-2); align-items: flex-start; flex-wrap: wrap; margin-top: var(--space-3);
    padding: var(--space-2) var(--space-3); background: var(--c-warn-soft); border: 1px solid var(--c-warn-line);
    border-radius: var(--radius-s); color: var(--c-warn); font-size: var(--fs-s);
  }
  .link-btn { border: 0; background: transparent; color: var(--c-brand-strong); text-decoration: underline; cursor: pointer; font-size: var(--fs-s); padding: var(--space-1) var(--space-2); min-height: var(--size-target); }
  .answer-note { font-size: var(--fs-xs); color: var(--c-ink-3); margin-top: var(--space-2); }

  .fb { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); margin: var(--space-2) var(--space-1) 0; font-size: var(--fs-s); color: var(--c-ink-2); }
  .fb-btn {
    display: inline-flex; align-items: center; gap: var(--space-2); min-height: var(--size-target);
    border: 1px solid var(--c-line-strong); background: var(--c-surface); color: var(--c-ink-2);
    border-radius: var(--radius-pill); padding: var(--space-1) var(--space-4); font-size: var(--fs-s); cursor: pointer;
  }
  .fb-btn svg { width: var(--size-icon-s); height: var(--size-icon-s); flex: 0 0 var(--size-icon-s); }
  .fb-btn:hover { border-color: var(--c-brand); color: var(--c-brand-strong); }
  .fb-btn:disabled { cursor: not-allowed; opacity: 0.6; }
  .fb-btn.sel { border-color: var(--c-brand); background: var(--c-brand-soft); color: var(--c-brand-strong); font-weight: bold; }
  .fb-thanks { color: var(--c-ok); }
  .fb-err { color: var(--c-err); }

  /* ---------- simplified product cards ---------- */
  .cards { display: flex; flex-direction: column; gap: var(--space-2); }
  .card { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--radius-l); box-shadow: var(--shadow-1); padding: var(--space-3); }
  .card-head { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-1); flex-wrap: wrap; }
  .code { font-family: var(--font-code); font-size: var(--fs-l); font-weight: bold; letter-spacing: 0.1em; color: var(--c-brand-strong); background: var(--c-brand-soft); border-radius: var(--radius-s); padding: var(--space-0) var(--space-3); }
  .navtag { font-size: var(--fs-xs); color: var(--c-ink-2); background: var(--c-surface-2); border: 1px solid var(--c-line); border-radius: var(--radius-pill); padding: var(--space-0) var(--space-2); }
  .filecount { font-size: var(--fs-xs); color: var(--c-ink-3); margin-left: auto; }
  .card-body { display: flex; gap: var(--space-3); align-items: flex-start; }
  .card-photo { flex: 0 0 var(--size-thumb); width: var(--size-thumb); height: var(--size-thumb); object-fit: contain; border: 1px solid var(--c-line); border-radius: var(--radius-m); background: var(--c-img-backing); }
  .card-info { flex: 1; min-width: 0; }
  .name { font-size: var(--fs-m); font-weight: bold; margin: 0 0 var(--space-1); }
  .details { list-style: none; margin: 0; padding: 0; font-size: var(--fs-s); color: var(--c-ink-2); }
  .details li { margin: var(--space-0) 0; }
  .cite-line { font-size: var(--fs-xs); color: var(--c-ink-3); margin-top: var(--space-1); }
  .cert { display: flex; gap: var(--space-3); align-items: flex-start; margin-top: var(--space-2); border: 1px solid; border-radius: var(--radius-s); padding: var(--space-2) var(--space-3); font-size: var(--fs-s); }
  .cert b { display: block; }
  .cert-dot { flex: 0 0 var(--space-3); width: var(--space-3); height: var(--space-3); margin-top: var(--space-1); border-radius: 50%; background: currentColor; }
  .cert.ok { background: var(--c-ok-soft); color: var(--c-ok); border-color: var(--c-ok-line); }
  .cert.warn { background: var(--c-warn-soft); color: var(--c-warn); border-color: var(--c-warn-line); }
  .cert.err { background: var(--c-err-soft); color: var(--c-err); border-color: var(--c-err-line); }
  .more { margin-top: var(--space-1); }
  .more > summary {
    display: flex; align-items: center; min-height: var(--size-target); cursor: pointer; list-style: none;
    padding: var(--space-2) var(--space-3); margin-bottom: var(--space-2); border: 1px dashed var(--c-line-strong);
    border-radius: var(--radius-m); color: var(--c-ink-2); background: var(--c-surface); font-size: var(--fs-s);
  }
  .more > summary::-webkit-details-marker { display: none; }
  .more > summary::before { content: "+ "; font-weight: bold; color: var(--c-brand); white-space: pre; }
  .more[open] > summary::before { content: "- "; }
  .foot-link { font-size: var(--fs-xs); color: var(--c-ink-3); }
  .foot-link a { color: var(--c-brand-strong); }

  /* ---------- composer ---------- */
  #composer { border-top: 1px solid var(--c-line); background: var(--c-surface); padding: var(--space-2) var(--space-4) var(--space-3); }
  .comp-in { max-width: var(--max-narrow); margin: 0 auto; }
  #thumbs { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-2); }
  #thumbs:empty { display: none; }
  .thumb-box { position: relative; width: var(--size-strip-h); height: var(--size-strip-h); }
  .thumb-box img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-s); border: 1px solid var(--c-line-strong); }
  .thumb-x {
    position: absolute; top: calc(var(--space-2) * -1); right: calc(var(--space-2) * -1); width: var(--size-target); height: var(--size-target);
    border-radius: 50%; border: 1px solid var(--c-line-strong); background: var(--c-surface); color: var(--c-ink); cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .thumb-x svg { width: var(--size-icon-s); height: var(--size-icon-s); }
  .thumb-busy { width: var(--size-strip-h); height: var(--size-strip-h); border-radius: var(--radius-s); border: 1px dashed var(--c-line-strong); display: flex; align-items: center; justify-content: center; font-size: var(--fs-xs); color: var(--c-ink-3); }
  .comp-row { display: flex; gap: var(--space-2); align-items: flex-end; }
  .icon-btn {
    flex: 0 0 var(--size-target-lg); width: var(--size-target-lg); height: var(--size-target-lg); padding: 0;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    border: 1px solid var(--c-line-strong); border-radius: var(--radius-m); background: var(--c-surface); color: var(--c-ink-2);
  }
  .icon-btn:hover { border-color: var(--c-brand); color: var(--c-brand-strong); background: var(--c-brand-soft); }
  .icon-btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .icon-btn svg { width: var(--size-icon); height: var(--size-icon); }
  #q {
    flex: 1; min-width: 0; min-height: var(--size-target-lg); max-height: calc(var(--size-target-lg) * 3); resize: none;
    padding: var(--space-3); font-size: var(--fs-m); line-height: 1.4;
    border: 1px solid var(--c-line-strong); border-radius: var(--radius-m); background: var(--c-surface); color: var(--c-ink);
  }
  #q::placeholder { color: var(--c-ink-3); }
  #sendBtn { min-height: var(--size-target-lg); padding: 0 var(--space-4); gap: var(--space-2); }
  #sendBtn svg { width: var(--size-icon); height: var(--size-icon); }
  #hint { font-size: var(--fs-xs); color: var(--c-ink-3); margin: var(--space-1) 0 0; min-height: 1.3em; }
  #hint.warn { color: var(--c-warn); }

  /* ---------- my questions panel ---------- */
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(100%, 26rem); z-index: 20; background: var(--c-page); border-left: 1px solid var(--c-line-strong); display: flex; flex-direction: column; box-shadow: var(--shadow-1); }
  #panelHead { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-4); background: var(--c-surface); border-bottom: 1px solid var(--c-line); }
  #panelHead h2 { flex: 1; margin: 0; font-size: var(--fs-l); }
  #panelBody { flex: 1; overflow-y: auto; padding: var(--space-3) var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
  .oq { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--radius-m); padding: var(--space-3); }
  .oq-q { font-weight: bold; margin: 0 0 var(--space-1); word-break: break-word; }
  .oq-meta { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; font-size: var(--fs-xs); color: var(--c-ink-3); }
  .state { font-size: var(--fs-xs); font-weight: bold; border-radius: var(--radius-pill); padding: var(--space-0) var(--space-2); border: 1px solid; }
  .state.warn { color: var(--c-warn); background: var(--c-warn-soft); border-color: var(--c-warn-line); }
  .state.ok { color: var(--c-ok); background: var(--c-ok-soft); border-color: var(--c-ok-line); }
  .state.mute { color: var(--c-ink-3); background: var(--c-surface-2); border-color: var(--c-line-strong); }
  .oq-art { margin-top: var(--space-2); padding: var(--space-2) var(--space-3); background: var(--c-surface-2); border-radius: var(--radius-s); font-size: var(--fs-s); }
  .oq-art b { display: block; color: var(--c-ink); }
  .oq-art p { margin: var(--space-1) 0 0; }
  .oq-gone { margin: var(--space-2) 0 0; font-size: var(--fs-s); color: var(--c-ink-3); }
  #panelList { display: flex; flex-direction: column; gap: var(--space-3); }
  #panelStatus { color: var(--c-ink-3); font-size: var(--fs-s); }

  /* ---------- article pictures ---------- */
  .pics { margin-top: var(--space-3); display: flex; flex-direction: column; gap: var(--space-3); }
  .pic-group-title { margin: 0 0 var(--space-1); font-size: var(--fs-s); font-weight: bold; color: var(--c-ink-2); }
  .pic-row { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .kb-pic {
    display: flex; flex-direction: column; align-items: stretch; gap: var(--space-1); width: var(--size-tile); padding: var(--space-1);
    border: 1px solid var(--c-line); border-radius: var(--radius-m); background: var(--c-surface-2); color: var(--c-ink);
    text-align: left; cursor: pointer; font-size: var(--fs-xs);
  }
  .kb-pic:hover { border-color: var(--c-brand); background: var(--c-brand-soft); }
  .kb-pic img { width: var(--size-thumb); height: var(--size-thumb); align-self: center; object-fit: contain; border-radius: var(--radius-s); background: var(--c-img-backing); }
  .kb-pic .pic-k { font-weight: bold; color: var(--c-brand-strong); }
  .kb-pic .pic-cap { display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--c-ink-2); word-break: break-word; }
  .pic-fail { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); font-size: var(--fs-s); color: var(--c-err); }
  .oq-art .pics { margin-top: var(--space-2); }
  @media (prefers-color-scheme: dark) {
    .kb-pic, #picView { --c-img-backing: var(--c-surface-2); }
  }

  #picView {
    padding: 0; width: min(96vw, var(--max-wide)); max-width: 96vw; max-height: 96vh; overflow: auto;
    border: 1px solid var(--c-line-strong); border-radius: var(--radius-l); background: var(--c-surface); color: var(--c-ink);
  }
  #picView::backdrop { background: var(--c-scrim); }
  .pv-in { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-3) var(--space-4) var(--space-4); }
  .pv-count { font-weight: bold; color: var(--c-ink-2); }
  .pv-stage {
    position: relative; display: flex; align-items: center; justify-content: center; min-height: calc(var(--size-empty) * 2);
    border: 1px solid var(--c-line); border-radius: var(--radius-m); background: var(--c-img-backing); touch-action: pinch-zoom;
  }
  .pv-stage img { display: block; max-width: 100%; max-height: 80vh; object-fit: contain; touch-action: pinch-zoom; }
  .pv-stage.loading img, .pv-stage.failed img { visibility: hidden; position: absolute; }
  .pv-load { position: absolute; color: var(--c-ink-3); font-size: var(--fs-s); }
  .pv-stage:not(.loading) .pv-load { display: none; }
  .pv-cap { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .pv-nav { display: flex; flex-wrap: wrap; gap: var(--space-2); justify-content: space-between; }
  .pv-btn { min-height: var(--size-target-lg); min-width: var(--size-target-lg); gap: var(--space-1); }
  .pv-btn svg { width: var(--size-icon); height: var(--size-icon); }

  @media (max-width: 520px) {
    .top { padding: var(--space-2) var(--space-3); }
    .top-inner { flex-wrap: wrap; gap: var(--space-2); }
    .title { flex: 1 1 40%; }
    .title p { display: none; }
    #who { order: 3; flex: 1 1 100%; max-width: 100%; }
    #thread { padding: var(--space-3) var(--space-3) var(--space-2); }
    #composer { padding: var(--space-2) var(--space-3) var(--space-2); }
    .row-user { max-width: 94%; }
    .b-sys { max-width: 100%; }
    .card-photo { flex-basis: var(--size-strip-h); width: var(--size-strip-h); height: var(--size-strip-h); }
    #sendBtn .send-text { display: none; }
    #sendBtn { padding: 0; width: var(--size-target-lg); }
    .fb-btn { min-height: var(--size-target-lg); }
    #hint .hint-keys { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .b-sys.wait::before { animation: none; } }
</style>
</head>
<body>
<div id="unsupported" class="panel" role="alert" hidden></div>

<div id="app" hidden>
<header class="top">
  <div class="top-inner">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2.5 2-2.5 3.5"/><path d="M12 15h.01"/></svg>
    </div>

  // ----- lightbox -----
  var lb = { model: null, gi: 0, pi: 0, opener: null, retried: {}, token: 0, first: false };
  function lbPic() {
    var g = lb.model && lb.model.groups[lb.gi];

  }
  function lbFailBox(show) {
    els.pvFail.textContent = '';

    b.type = 'button';
    b.addEventListener('click', function () {

      lbFailBox(false);
      lbReload(true);
    });

  function lbShow() {
    var pic = lbPic();
    var g = lb.model.groups[lb.gi];
    if (!pic) { lbFailBox(true); return; }
    els.pvCount.textContent = lightboxCountText(pic.k, g.pics.length) + (lb.model.showHeadings ? ' · ' + g.title : '');
    els.pvCap.textContent = pic.caption;
    els.pvCap.hidden = !pic.caption;
    els.pvPrev.disabled = lb.pi <= 0;
    els.pvNext.disabled = lb.pi >= g.pics.length - 1;
    lbFailBox(false);
    els.pvImg.alt = pic.alt;
    els.pvImg.src = pic.url;
    if (lb.first) { lb.first = false; (els.pvNext.disabled ? els.pvClose : els.pvNext).focus(); }
    else if (!els.pv.contains(document.activeElement) || document.activeElement.disabled) els.pvClose.focus();

  // forceSign: ask for fresh URLs first.
  function lbReload(forceSign) {
    var model = lb.model;
    var pic = lbPic();
    if (!pic) { lbFailBox(true); return; }
    var articleId = model.groups[lb.gi].articleId;
    var picId = pic.id;
    var token = ++lb.token;
    var needSign = forceSign || imagesExpired(model.expiresAt, Date.now());
    if (!needSign) { lbShow(); return; }
    els.pvStage.className = 'pv-stage loading';
    signModel(model).then(function (ok) {
      if (token !== lb.token) return;
      if (!ok) { lbFailBox(true); return; }
      model.rendered = model.version;
      renderPicBlock(model);
      var found = false;
      model.groups.forEach(function (g, gi) {
        if (String(g.articleId) !== String(articleId)) return;
        g.pics.forEach(function (p, pi) { if (String(p.id) === String(picId)) { lb.gi = gi; lb.pi = pi; found = true; } });
      });
      if (!found) { lbFailBox(true); return; }
      lbShow();
    });
  }
  function openLightbox(model, gi, pi, opener) {
    lb.model = model; lb.gi = gi; lb.pi = pi; lb.opener = opener; lb.retried = {}; lb.first = true;
    if (typeof els.pv.showModal === 'function') els.pv.showModal(); else els.pv.setAttribute('open', '');
    lbReload(false);
  }
  function lbGo(i) {
    var g = lb.model && lb.model.groups[lb.gi];
    if (!g || i === lb.pi) return;
    lb.pi = i;
    lbReload(false);
  }
  els.pvImg.addEventListener('load', function () { els.pvStage.className = 'pv-stage'; });
  els.pvImg.addEventListener('error', function () {

  // Send (or re-send) the question of one turn. History is every answered turn before it.
  async function ask(turn) {
    if (busy || !current) return;
    if (!isSessionValid(current, Date.now())) {
      clearStored();
      lockChat(reasonMessage('expired'));
      return;
    }
    closeMenu();
    var idx = turns.indexOf(turn);
    var body = buildAskBody(turn, historyFromTurns(turns, idx));
    turn.state = 'wait';
    turn.slow = false;
    setBusy(true);
    renderReply(turn);
    scrollToEnd();
    var slowTimer = setTimeout(function () {
      if (turn.state !== 'wait') return;
      turn.slow = true;
      renderReply(turn);
    }, SLOW_WAIT_MS);
    var r = await postJson('/functions/v1/ask', body, sessionHeaders(), ASK_TIMEOUT_MS);
    clearTimeout(slowTimer);
    turn.slow = false;
    if (r.status === 200 && r.data && (r.data.topic === 'product' || r.data.topic === 'it')) {
      turn.view = replyView(r.data, SUPABASE_URL, ALLOW_DATA);
      turn.picModel = null;
      turn.reply = turn.view.historyText ? { text: turn.view.historyText, topic: turn.view.topic } : null;
      turn.state = 'done';
      turn.error = '';
      compactTurnImages(turn, turn.view.pictureText);
      pruneOldPreviews(turns, KEEP_PREVIEW_TURNS, function (u) { try { URL.revokeObjectURL(u); } catch (e) { /* ignore */ } });
      turns.forEach(function (t) { if (t.userEl && t !== turn) renderUser(t); });
      renderUser(turn);
      renderReply(turn);
      setBusy(false);
      scrollToTop(turn.el);
      return;
    }
    turn.reply = null;
    if (r.status === 401) {
      clearStored();
      turn.state = 'error';
      turn.error = errorText(401, r.data);
      renderReply(turn);
      setBusy(false);
      lockChat(turn.error);
      return;
    }
    turn.state = 'error';
    turn.error = errorText(r.status, r.data);
    renderReply(turn);
    setBusy(false);
    scrollToEnd();
  }

  async function loadSource(file) {
    if (window.createImageBitmap) {
      try { return await createImageBitmap(file); } catch (e) { /* fall back to Image */ }
    }
    return await new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var im = new Image();
      im.onload = function () { URL.revokeObjectURL(url); resolve(im); };
      im.onerror = function () { URL.revokeObjectURL(url); reject(new Error('decode')); };
      im.src = url;
    });
  }
  // Longest side 1280, JPEG 0.8; steps down only if the result is still over the server limit.
  async function shrinkImage(file) {
    var src = await loadSource(file);
    var w = src.width || src.naturalWidth;
    var h = src.height || src.naturalHeight;
    var cap = MAX_SIDE;
    for (var round = 0; round < 4; round++) {
      var sz = shrinkSize(w, h, cap);
      var cv = document.createElement('canvas');
      cv.width = sz.w; cv.height = sz.h;
      var ctx = cv.getContext('2d');
      ctx.fillStyle = 'white'; // ds-allow-hardcode: JPEG has no alpha; transparent PNG pixels become white
      ctx.fillRect(0, 0, sz.w, sz.h);
      ctx.drawImage(src, 0, 0, sz.w, sz.h);
      var qualities = [JPEG_QUALITY, 0.65, 0.5];
      for (var qi = 0; qi < qualities.length; qi++) {
        var url = cv.toDataURL('image/jpeg', qualities[qi]);
        var b64 = dataUrlToBase64(url);
        if (b64 && decodedBytes(b64) <= MAX_IMAGE_BYTES) {
          var tw = shrinkSize(sz.w, sz.h, 96);
          var tc = document.createElement('canvas');
          tc.width = tw.w; tc.height = tw.h;
          tc.getContext('2d').drawImage(cv, 0, 0, tw.w, tw.h);
          var thumb = tc.toDataURL('image/jpeg', 0.6);
          if (src.close) src.close();
          return { data: b64, preview: url, thumb: thumb };
        }
      }
      cap = Math.round(cap * 0.75);
    }
    throw new Error('too_big');
  }
  async function addFiles(files) {
    var list = Array.prototype.slice.call(files || []).filter(function (f) { return f && /^image[/]/.test(f.type); });
    if (!list.length) return;
    var room = roomForImages(attached.length + shrinking, list.length);
    if (room < list.length) setHint('แนบได้สูงสุด ' + MAX_IMAGES + ' รูป', true);
    else setHint('', false);
    list = list.slice(0, room);
    var failed = 0;
    shrinking += list.length;
    renderThumbs(); updateSend();
    for (var i = 0; i < list.length; i++) {
      try { attached.push(await shrinkImage(list[i])); } catch (e) { failed++; }
      shrinking--;
      renderThumbs(); updateSend();
    }
    if (failed) setHint('อ่านรูปไม่ได้ ' + failed + ' รูป ลองรูปอื่น', true);
  }

  function submit() {
    if (!current || busy || shrinking > 0) return;
    var text = els.q.value.trim();
    if (!canSend(text, attached.length, busy)) return;
    var turn = { id: nextTurnId++, q: text, topic: 'auto', images: attached.slice(), pictureText: '', state: 'wait', view: null, reply: null, error: '' };
    attached = [];
    els.q.value = '';
    growBox();
    renderThumbs();
    setHint('', false);
    addTurn(turn);
    ask(turn);
  }

  els.composer.addEventListener('submit', function (ev) { ev.preventDefault(); submit(); });
  els.q.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing && ev.keyCode !== 229) {
      ev.preventDefault();
      submit();
    }
  });
  els.q.addEventListener('input', function () { growBox(); updateSend(); });
  els.q.addEventListener('paste', function (ev) {
    var items = ev.clipboardData && ev.clipboardData.items ? ev.clipboardData.items : [];
    var files = [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === 'file' && /^image[/]/.test(items[i].type)) {
        var f = items[i].getAsFile();
        if (f) files.push(f);
      }
    }
    if (files.length) { ev.preventDefault(); addFiles(files); }
  });
  els.cam.appendChild(icon('camera'));
  els.gal.appendChild(icon('image'));
  els.send.insertBefore(icon('send'), els.send.firstChild);
  els.cam.addEventListener('click', function () { els.camInput.click(); });
  els.gal.addEventListener('click', function () { els.galInput.click(); });
  [els.camInput, els.galInput].forEach(function (inp) {
    inp.addEventListener('change', function () { addFiles(inp.files); inp.value = ''; });
  });
  document.addEventListener('click', function (ev) {
    if (openMenu && !openMenu.menu.contains(ev.target)) closeMenu();
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    if (els.pv.open) return;
    if (openMenu) { var b = openMenu.btn; closeMenu(); b.focus(); return; }
    if (!els.panel.hidden) closePanel();
  });

  // ---------- my questions ----------
  var panelOpener = null;
  async function loadMine() {
    els.panelStatus.textContent = 'กำลังโหลด...';
    els.panelList.textContent = '';
    els.panelRefresh.disabled = true;
    var r = current ? await postJson('/functions/v1/kb', buildKbBody('open.mine', { limit: 30 }), sessionHeaders()) : { status: 401, data: null };
    els.panelRefresh.disabled = false;
    if (r.status === 401) { els.panelStatus.textContent = errorText(401); return; }
    if (r.status !== 200 || !r.data || !Array.isArray(r.data.rows)) { els.panelStatus.textContent = 'โหลดรายการไม่สำเร็จ ลองรีเฟรชอีกครั้ง'; return; }
    els.panelStatus.textContent = r.data.rows.length ? '' : 'ยังไม่มีคำถามที่ส่งถึงทีมไอที';
    r.data.rows.forEach(function (row) {
      var v = openRowView(row, SUPABASE_URL, ALLOW_DATA);
      var card = addText(els.panelList, 'div', 'oq', '');
      addText(card, 'p', 'oq-q', v.question);
      var meta = addText(card, 'div', 'oq-meta', '');
      addText(meta, 'span', 'state ' + v.tone, v.stateLabel);
      if (v.askedText) addText(meta, 'span', '', v.askedText);
      if (v.articleGone) addText(card, 'p', 'oq-gone', v.articleGone);
      if (v.articleTitle || v.articleLines.length) {
        var art = addText(card, 'div', 'oq-art', '');
        if (v.articleTitle) addText(art, 'b', '', v.articleTitle);
        addLines(art, v.articleLines);
        if (v.articlePics) makePicHost(art, v.articlePics);
      }
    });
  }
  function openPanel(opener) {
    panelOpener = opener || els.mineBtn;
    els.panel.hidden = false;
    els.panelClose.focus();
    loadMine();
  }
  function closePanel() {
    if (els.panel.hidden) return;
    els.panel.hidden = true;
    if (panelOpener && document.contains(panelOpener)) panelOpener.focus();
  }
  els.mineBtn.addEventListener('click', function () { if (els.panel.hidden) openPanel(els.mineBtn); else closePanel(); });
  els.panelClose.addEventListener('click', closePanel);
  els.panelRefresh.addEventListener('click', loadMine);

  updateSend();
  startSession();
})();
</script>
</body>
</html>
