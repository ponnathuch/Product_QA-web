<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>จัดการความรู้ IT</title>
<link rel="stylesheet" href="pqa-theme.css?v=1">
<style>
  /* Page layout only. Colours, fonts, radii, spacing and focus come from pqa-theme.css tokens. */
  .top-inner { max-width: var(--max-wide); flex-wrap: wrap; }
  #who { font-size: var(--fs-s); max-width: 40%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #who:empty { display: none; }

  main { max-width: var(--max-wide); margin: calc(var(--space-6) * -1 - var(--space-3)) auto 0; padding: 0 var(--space-4) calc(var(--space-6) + var(--space-2)); }
  .panel { margin-bottom: var(--space-3); }
  .panel h2 { font-size: var(--fs-l); margin: 0 0 var(--space-3); color: var(--c-brand-strong); }
  .panel h3 { font-size: var(--fs-m); margin: var(--space-4) 0 var(--space-2); color: var(--c-ink-2); }
  #msg { display: flex; gap: var(--space-3); align-items: flex-start; }
  #msg.error { color: var(--c-err); font-weight: bold; }
  #msg.info { color: var(--c-ink-2); }
  #denied a { color: var(--c-brand-strong); font-weight: bold; }

  .note { font-size: var(--fs-s); color: var(--c-ink-3); margin: var(--space-2) 0 0; }
  .note.err { color: var(--c-err); font-weight: bold; }
  .note.ok { color: var(--c-ok); }
  .note.warn { color: var(--c-warn); }
  label.lbl { display: block; font-size: var(--fs-s); color: var(--c-ink-2); margin: var(--space-3) 0 var(--space-1); font-weight: bold; }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: flex-end; }
  .row > .grow { flex: 1; min-width: var(--size-field); }
  .input { width: 100%; }
  textarea.input { display: block; resize: vertical; line-height: 1.5; }
  .input.bad { border-color: var(--c-err); background: var(--c-err-soft); }
  .actions { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); align-items: center; }
  .btn.small { font-size: var(--fs-s); padding: var(--space-1) var(--space-3); }
  .btn.danger { background: var(--c-surface); color: var(--c-err); border-color: var(--c-err-line); }
  .btn.danger:hover { background: var(--c-err-soft); border-color: var(--c-err); }
  .btn .ic { width: var(--size-icon-s); height: var(--size-icon-s); margin-right: var(--space-1); flex: 0 0 auto; }

  .tag {
    font-size: var(--fs-xs); font-weight: bold; border-radius: var(--radius-pill); padding: var(--space-0) var(--space-2);
    color: var(--c-brand-strong); background: var(--c-brand-soft); white-space: nowrap;
  }
  .tag.ok { color: var(--c-ok); background: var(--c-ok-soft); }
  .tag.warn { color: var(--c-warn); background: var(--c-warn-soft); }
  .tag.err { color: var(--c-err); background: var(--c-err-soft); }
  .tags { display: flex; flex-wrap: wrap; gap: var(--space-1); }
  .empty { color: var(--c-ink-3); font-size: var(--fs-s); }

  .counter { font-size: var(--fs-xs); color: var(--c-ink-3); margin-top: var(--space-1); text-align: right; }
  .counter.warn { color: var(--c-warn); }
  .counter.err { color: var(--c-err); font-weight: bold; }

  /* ---------- tabs and lists ---------- */
  .tabs { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-3); }
  .tab { border: 1px solid var(--c-line-strong); border-radius: var(--radius-pill); background: var(--c-surface); color: var(--c-ink-2); min-height: var(--size-target); padding: var(--space-1) var(--space-4); font-size: var(--fs-s); cursor: pointer; }
  .tab:hover { background: var(--c-brand-soft); }
  .tab[aria-selected="true"] { background: var(--c-brand-soft); border-color: var(--c-brand); color: var(--c-brand-strong); font-weight: bold; }
  .tab .badge { margin-left: var(--space-2); }
  .list { list-style: none; margin: 0; padding: 0; }
  .list > li { padding: var(--space-2) 0; border-bottom: 1px solid var(--c-line); font-size: var(--fs-s); }
  .list > li:last-child { border-bottom: 0; }
  .list .when { color: var(--c-ink-3); font-size: var(--fs-xs); }
  .list .who { font-weight: bold; }
  .list .sum { color: var(--c-ink-2); word-break: break-word; }
  .item-row { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
  .item-main {
    flex: 1; min-width: var(--size-field); display: block; text-align: left; border: 0; background: transparent; color: var(--c-ink);
    padding: var(--space-2) var(--space-1); font-size: var(--fs-s); cursor: pointer; border-radius: var(--radius-s); min-height: var(--size-target);
  }
  .item-main:hover { background: var(--c-brand-soft); }
  .item-title { display: block; font-weight: bold; word-break: break-word; }
  .item-meta { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-3); align-items: center; color: var(--c-ink-3); font-size: var(--fs-xs); margin-top: var(--space-1); }
  .pager { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; margin-top: var(--space-3); }

  /* ---------- editor ---------- */
  .quote { margin: 0 0 var(--space-3); padding: var(--space-3); border-left: 4px solid var(--c-brand-line); background: var(--c-surface-2); border-radius: var(--radius-s); font-size: var(--fs-s); word-break: break-word; white-space: pre-wrap; }
  .quote .when { display: block; color: var(--c-ink-3); font-size: var(--fs-xs); margin-bottom: var(--space-1); white-space: normal; }
  .warnbox { margin-top: var(--space-3); padding: var(--space-3); border: 1px solid var(--c-err-line); border-radius: var(--radius-m); background: var(--c-err-soft); color: var(--c-err); font-weight: bold; font-size: var(--fs-s); display: flex; gap: var(--space-2); align-items: flex-start; }
  .warnbox svg { flex: 0 0 var(--size-icon); width: var(--size-icon); height: var(--size-icon); }

  /* ---------- confirm dialogs ---------- */
  #scrim { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--c-scrim); z-index: 10; overflow: auto; padding: var(--space-4); }
  #scrim.open { display: block; }
  .modal {
    max-width: var(--max-narrow); margin: var(--space-5) auto; background: var(--c-surface); color: var(--c-ink);
    border: 1px solid var(--c-line-strong); border-radius: var(--radius-l); padding: var(--space-4);
  }
  .modal h2 { font-size: var(--fs-l); margin: 0 0 var(--space-3); color: var(--c-brand-strong); }
  .modal p { margin: 0 0 var(--space-2); word-break: break-word; }
  .modal-err { color: var(--c-err); font-weight: bold; font-size: var(--fs-s); margin-top: var(--space-3); }
  .modal-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); justify-content: flex-end; margin-top: var(--space-4); }
  #scrim :focus-visible { outline-color: var(--c-brand); }

  /* ---------- PDF drafts ---------- */
  .draft { border: 1px solid var(--c-line-strong); border-radius: var(--radius-m); padding: var(--space-3); margin-bottom: var(--space-3); background: var(--c-surface); }
  .draft.saved { border-color: var(--c-ok); }
  .draft.failed { border-color: var(--c-err-line); }
  .draft-head { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
  .draft-head input[type="checkbox"] { width: var(--size-icon); height: var(--size-icon); flex: 0 0 auto; }
  .draft-head label { font-weight: bold; color: var(--c-ink-2); }
  .draft-group { font-size: var(--fs-s); color: var(--c-ink-2); margin: var(--space-4) 0 var(--space-2); padding-bottom: var(--space-1); border-bottom: 1px solid var(--c-line-strong); word-break: break-word; }
  #pdfKindWrap { flex: 1 1 var(--size-field); min-width: 0; }
  .draft .src { color: var(--c-ink-3); font-size: var(--fs-xs); margin: var(--space-2) 0 0; word-break: break-word; }

  #oldBrowser { max-width: var(--max-narrow); margin: var(--space-6) auto; padding: 0 var(--space-4); }

  @media (max-width: 520px) {
    .top { padding: var(--space-3) var(--space-3) calc(var(--space-6) * 2 - var(--space-3)); }
    .title p { display: none; }
    #who { max-width: 100%; order: 3; flex: 1 1 100%; }
    main { padding: 0 var(--space-3) var(--space-6); }
    .btn { min-height: var(--size-target-lg); }
    .tab { flex: 1 1 auto; }
  }
</style>
</head>
<body>
<div id="oldBrowser" hidden>
  <div class="panel" role="alert"><p id="oldBrowserText"></p></div>
</div>

<header class="top" id="topBar">
  <div class="top-inner">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M9 7h7"/><path d="M9 11h5"/></svg>
    </div>
    <div class="title">
      <h1>จัดการความรู้ IT</h1>
      <p>เขียนและแก้บทความแก้ปัญหา และตอบคำถามที่ระบบยังตอบไม่ได้ มีผลกับสาขาทันที</p>
    </div>
    <div id="who"></div>
    <a id="backLink" class="top-link" href="chat.html">กลับไปหน้าถามคำถาม</a>
  </div>
</header>

<main id="mainBox">
  <div id="msg" class="panel" role="status" hidden></div>

  <div id="denied" class="panel" hidden>
    <p id="deniedText"></p>
    <p><a id="deniedLink" href="chat.html">กลับไปหน้าถามคำถาม</a></p>
  </div>

  <div id="app" hidden>
    <div id="tabs" class="tabs" role="tablist" aria-label="หมวดจัดการความรู้ IT"></div>

    <!-- Tab 1: Open Questions -->
    <section id="panel-open" class="panel" role="tabpanel" aria-labelledby="tab-open" hidden>
      <h2 id="hOpen">คำถามรอ IT ตอบ</h2>
      <div class="row">
        <div class="grow">
          <label class="lbl" for="openFilter">แสดงคำถามที่</label>
          <!-- ds-allow-native-select: native select keeps keyboard and screen-reader behaviour on old Edge 109 -->
          <select id="openFilter" class="input"></select>
        </div>
      </div>
      <ul id="openList" class="list"></ul>
      <p id="openNote" class="note" role="status" aria-live="polite"></p>
      <div class="pager">
        <button type="button" id="openPrev" class="btn alt small" disabled>ก่อนหน้า</button>
        <span id="openPage" class="note"></span>
        <button type="button" id="openNext" class="btn alt small" disabled>ถัดไป</button>
      </div>
    </section>

    <!-- Tab 2: Articles -->
    <section id="panel-articles" class="panel" role="tabpanel" aria-labelledby="tab-articles" hidden>
      <h2 id="hArticles">บทความ</h2>
      <div class="row">
        <div class="grow">
          <label class="lbl" for="articleSearch">ค้นหาบทความ</label>
          <input type="search" id="articleSearch" class="input" maxlength="100" autocomplete="off" placeholder="เช่น เครื่องพิมพ์ใบเสร็จ หรือ POS เปิดไม่ติด">
        </div>
        <button type="button" id="articleSearchBtn" class="btn alt">ค้นหา</button>
        <button type="button" id="articleNew" class="btn">เขียนบทความใหม่</button>
        <div id="pdfKindWrap" hidden>
          <label class="lbl" for="pdfKind">ประเภทเอกสาร</label>
          <!-- ds-allow-native-select: native select keeps keyboard and screen-reader behaviour on old Edge 109 -->
          <select id="pdfKind" class="input"><option value="manual">คู่มือ / วิธีแก้ปัญหา</option><option value="policy">นโยบาย / ระเบียบ</option></select>
        </div>
        <button type="button" id="pdfBtn" class="btn alt" hidden>สร้างบทความจากไฟล์</button>
        <input type="file" id="pdfFile" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" multiple hidden>
      </div>
      <p id="pdfNote" class="note" role="status" aria-live="polite"></p>
      <ul id="articleList" class="list"></ul>
      <p id="articleNote" class="note" role="status" aria-live="polite"></p>
      <div class="pager">
        <button type="button" id="articlePrev" class="btn alt small" disabled>ก่อนหน้า</button>
        <span id="articlePage" class="note"></span>
        <button type="button" id="articleNext" class="btn alt small" disabled>ถัดไป</button>
      </div>

      <h3 id="hLog">ประวัติการแก้ไข</h3>
      <ul id="logList" class="list"></ul>
      <div class="actions"><button type="button" id="logMore" class="btn alt small" hidden>ดูรายการก่อนหน้า</button></div>
      <p id="logNote" class="note" role="status" aria-live="polite"></p>
    </section>

    <!-- Tab 3: Editors -->
    <section id="panel-editors" class="panel" role="tabpanel" aria-labelledby="tab-editors" hidden>
      <h2 id="hEditors">ผู้ดูแล</h2>
      <p class="note" id="editorsHelp"></p>
      <ul id="editorList" class="list"></ul>
      <p id="editorListNote" class="note" role="status" aria-live="polite"></p>
      <div id="editorAddBox" hidden>
        <h3>เพิ่มผู้ดูแล</h3>
        <div class="row">
          <div class="grow">
            <label class="lbl" for="editorU">ชื่อผู้ใช้ Job Tracker</label>
            <input type="text" id="editorU" class="input" maxlength="64" autocomplete="off">
          </div>
          <div class="grow">
            <label class="lbl" for="editorN">ชื่อที่แสดง (ไม่บังคับ)</label>
            <input type="text" id="editorN" class="input" maxlength="100" autocomplete="off">
          </div>
          <button type="button" id="editorAdd" class="btn">เพิ่มผู้ดูแล</button>
        </div>
        <p id="editorAddNote" class="note" role="status" aria-live="polite"></p>
      </div>
    </section>

    <!-- Article editor: replaces the list of the tab it was opened from -->
    <section id="editorPanel" class="panel" aria-labelledby="hEditor" hidden>
      <h2 id="hEditor">บทความ</h2>
      <blockquote id="quote" class="quote" hidden></blockquote>
      <label class="lbl" for="fTitle">หัวข้อ</label>
      <input type="text" id="fTitle" class="input" autocomplete="off" aria-describedby="titleCounter">
      <div id="titleCounter" class="counter" aria-live="off"></div>
      <label class="lbl" for="fBody">เนื้อหา (ขั้นตอนแก้ปัญหา ข้อละบรรทัด)</label>
      <textarea id="fBody" class="input" rows="12" aria-describedby="bodyCounter"></textarea>
      <div id="bodyCounter" class="counter" aria-live="off"></div>
      <label class="lbl" for="fTags">แท็ก (คั่นด้วยจุลภาค เช่น POS, เครื่องพิมพ์)</label>
      <input type="text" id="fTags" class="input" autocomplete="off" aria-describedby="tagsCounter">
      <div id="tagsCounter" class="counter" aria-live="off"></div>
      <div id="secretBox" class="warnbox" role="alert" hidden></div>
      <div class="actions">
        <button type="button" id="fSave" class="btn">บันทึกบทความ</button>
        <button type="button" id="fCancel" class="btn alt">กลับไปรายการ</button>
        <button type="button" id="fDismiss" class="btn danger" hidden>ปิดเรื่อง</button>
        <button type="button" id="fDelete" class="btn danger" hidden>ลบบทความ</button>
      </div>
      <p id="fNote" class="note" role="status" aria-live="polite"></p>
    </section>

    <!-- PDF drafts review: replaces the list of the Articles tab -->
    <section id="pdfPanel" class="panel" aria-labelledby="hPdf" hidden>
      <h2 id="hPdf">ตรวจร่างบทความจากไฟล์</h2>
      <p id="pdfSummary" class="note" tabindex="-1"></p>
      <p id="pdfFailed" class="note" role="status"></p>
      <div id="pdfCards"></div>
      <div class="actions">
        <button type="button" id="pdfSave" class="btn"></button>
        <button type="button" id="pdfCancel" class="btn alt">ยกเลิก</button>
      </div>
      <p id="pdfSaveNote" class="note" role="status" aria-live="polite"></p>
    </section>
  </div>
</main>

<div id="scrim"></div>

<script>
(function () {
  var SUPABASE_URL = 'https://zuyqwkjvjuwykrdhzhwq.supabase.co';
  var TIMEOUT_MS = 30000;
  var STORE_KEY = 'pqa.session';
  var SVG_NS = 'http://www.w3.org/2000/svg';

  // BEGIN PURE
  var TITLE_MAX = 200;
  var BODY_MAX = 6000;
  var TAGS_MAX = 10;
  var TAG_MAX = 40;
  var USER_MAX = 64;
  var NAME_MAX = 100;
  var LIST_PAGE = 20;
  var LOG_PAGE = 20;
  var TAB_DEFS = [
    { id: 'open', label: 'คำถามรอ IT ตอบ' },
    { id: 'articles', label: 'บทความ' },
    { id: 'editors', label: 'ผู้ดูแล' }
  ];
  var STATUS_ORDER = ['waiting', 'answered', 'dismissed'];
  var STATUS_LABEL = { waiting: 'รอ IT ตอบ', answered: 'ตอบแล้ว', dismissed: 'ปิดเรื่อง' };
  var FILTER_LABEL = { waiting: 'รอ IT ตอบ', answered: 'ตอบแล้ว', dismissed: 'ปิดเรื่องแล้ว' };
  var SECRET_TEXT = 'ห้ามใส่รหัสผ่านหรือคีย์ในบทความ';
  var LEAVE_TEXT = 'ยังมีข้อมูลที่ยังไม่ได้บันทึก ถ้าออกจากหน้านี้ข้อมูลจะหายไป';
  var NO_SESSION_TEXT = 'กรุณาเปิดจากเมนู ถามคำถาม ใน Job Tracker';
  var NO_ACCESS_TEXT = 'หน้านี้สำหรับทีมไอทีที่ดูแลความรู้ IT เท่านั้น ถ้าต้องการสิทธิ์ ติดต่อผู้ดูแลระบบ';
  var OLD_BROWSER_TEXT = 'เบราว์เซอร์นี้เก่าเกินไปสำหรับหน้านี้ กรุณาอัปเดตเบราว์เซอร์ หรือเปิดด้วย Chrome หรือ Edge';
  var ACTION_LABEL = {
    'article.create': 'เพิ่มบทความ', 'article.update': 'แก้บทความ', 'article.delete': 'ลบบทความ',
    'article.restore': 'กู้คืนบทความ', 'open.dismiss': 'ปิดเรื่องคำถาม', 'editors.add': 'เพิ่มผู้ดูแล',
    'editors.remove': 'เอาผู้ดูแลออก'
  };
  var THAI_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

  // ----- feature check: probe is { promise, fetch, asyncFn, optionalChaining } (booleans) -----
  function missingFeatures(probe) {
    var p = probe || {};
    var out = [];
    if (!p.promise) out.push('Promise');
    if (!p.fetch) out.push('fetch');
    if (!p.asyncFn) out.push('async functions');
    if (!p.optionalChaining) out.push('optional chaining');
    return out;
  }
  function featureMessage(probe) {
    return missingFeatures(probe).length ? OLD_BROWSER_TEXT : '';
  }

  // ----- roles, from the kb `me` reply -----
  function roleOf(me) {
    if (!me || typeof me !== 'object') return 'staff';
    if (me.isAdmin === true) return 'admin';
    if (me.isItEditor === true) return 'editor';
    return 'staff';
  }
  function canEditKb(me) { var r = roleOf(me); return r === 'admin' || r === 'editor'; }
  function canManageEditors(me) { return roleOf(me) === 'admin'; }
  function editorsHelpText(me) {
    return canManageEditors(me)
      ? 'ผู้ดูแลระบบเพิ่มหรือเอาผู้ดูแลความรู้ IT ออกได้ที่นี่ (ผู้ดูแลระบบทุกคนทำได้เหมือนผู้ดูแลความรู้ IT อยู่แล้ว)'
      : 'ดูรายชื่อได้อย่างเดียว ผู้ดูแลระบบเท่านั้นที่เพิ่มหรือเอาผู้ดูแลออกได้';
  }
  function roleLabel(me) {
    var r = roleOf(me);
    return r === 'admin' ? 'ผู้ดูแลระบบ' : r === 'editor' ? 'ผู้ดูแลความรู้ IT' : 'พนักงาน';
  }

  // ----- tabs and labels -----
  function tabLabel(id) {
    for (var i = 0; i < TAB_DEFS.length; i++) if (TAB_DEFS[i].id === id) return TAB_DEFS[i].label;
    return '';
  }
  function statusLabel(s) { return STATUS_LABEL[s] || 'ไม่ทราบสถานะ'; }
  function statusTone(s) { return s === 'waiting' ? 'warn' : s === 'answered' ? 'ok' : ''; }
  function filterLabel(s) { return FILTER_LABEL[s] || FILTER_LABEL.waiting; }
  function nextTab(current, key) {
    var ids = TAB_DEFS.map(function (t) { return t.id; });
    var i = ids.indexOf(current);
    if (i < 0) return ids[0];
    if (key === 'ArrowRight') return ids[(i + 1) % ids.length];
    if (key === 'ArrowLeft') return ids[(i + ids.length - 1) % ids.length];
    if (key === 'Home') return ids[0];
    if (key === 'End') return ids[ids.length - 1];

    var kind = pdfKind(els.pdfKind.value);
    var batch = pdfFilterBatch(picked);
    var skippedText = pdfSkippedText(batch.skipped);
    if (!batch.accepted.length) { setNote(els.pdfNote, skippedText || 'กรุณาเลือกไฟล์', 'err'); els.pdfBtn.focus(); return; }
    state.busy = true;

    var failed = [];
    var unread = [];

    function finish() {

      readFileBase64(item.file).then(function (data) {
        return api(pdfDraftBody(name, data, item.mime, kind), PDF_TIMEOUT_MS);

    }, function (err) {
      if (err && err.status === 401) return;
      if (err && err.status === 403) { hideMessage(); showDenied(NO_ACCESS_TEXT); return; }
      showMessage(failText(err), true);
    });
  }
  function startPage() {
    var missing = featureMessage(probeFeatures());
    if (missing) {
      els.topBar.hidden = true;
      els.mainBox.hidden = true;
      els.oldBrowser.hidden = false;
      els.oldBrowserText.textContent = missing;
      return;
    }
    var sso = getSsoParam(window.location.search);
    if (sso !== null) {
      try { history.replaceState(null, '', cleanUrl(window.location.pathname, window.location.search, window.location.hash)); } catch (e) { /* ignore */ }
      showMessage('กำลังเข้าสู่ระบบ...', false);
      post('/functions/v1/session', { link: sso }).then(function (r) {
        if (r.status === 200 && r.data && typeof r.data.session === 'string') {
          var sess = {
            session: r.data.session, staff: r.data.staff || {}, isAdmin: !!r.data.isAdmin,
            canManage: !!r.data.canManage, expiresAt: r.data.expiresAt
          };
          saveStored(sess);
          begin(sess);
        } else {
          showDenied(r.status === 401 ? errorText(401) : errorText(0));
        }
      });
      return;
    }
    var stored = loadStored();
    if (!isSessionValid(stored, Date.now())) {
      clearStored();
      showDenied(NO_SESSION_TEXT);
      return;
    }
    begin(stored);
  }

  els.openFilter.addEventListener('change', function () {
    state.openFilter = els.openFilter.value;
    state.openOffset = 0;
    loadOpen();
  });
  els.openPrev.addEventListener('click', function () { state.openOffset = Math.max(0, state.openOffset - LIST_PAGE); loadOpen(); });
  els.openNext.addEventListener('click', function () { state.openOffset += LIST_PAGE; loadOpen(); });
  els.articleSearchBtn.addEventListener('click', runSearch);
  els.articleSearch.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); runSearch(); } });
  els.articleNew.addEventListener('click', newArticle);
  els.articlePrev.addEventListener('click', function () { state.articleOffset = Math.max(0, state.articleOffset - LIST_PAGE); loadArticles(); });
  els.articleNext.addEventListener('click', function () { state.articleOffset += LIST_PAGE; loadArticles(); });
  (function () {
    var ic = icon('file');
    ic.setAttribute('class', 'ic');
    els.pdfBtn.insertBefore(ic, els.pdfBtn.firstChild);
  })();
  els.pdfBtn.addEventListener('click', function () { if (!state.busy) els.pdfFile.click(); });
  els.pdfFile.addEventListener('change', onPdfChosen);
  els.pdfSave.addEventListener('click', savePdfDrafts);
  els.pdfCancel.addEventListener('click', cancelPdf);
  els.logMore.addEventListener('click', function () { loadLog(false); });
  els.editorAdd.addEventListener('click', addEditor);
  els.editorU.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addEditor(); } });
  [els.fTitle, els.fBody, els.fTags].forEach(function (n) {
    n.addEventListener('input', function () { updateCounters(); markField(n, false); if (!els.fTitle.classList.contains('bad') && !els.fBody.classList.contains('bad')) { els.secretBox.hidden = true; } });
  });
  els.fSave.addEventListener('click', saveArticle);
  els.fCancel.addEventListener('click', function () {
    confirmLeave().then(function (ok) { if (ok) closeEditor(); });
  });
  els.fDismiss.addEventListener('click', dismissFromEditor);
  els.fDelete.addEventListener('click', deleteArticle);
  guardLink(els.backLink);

  startPage();
})();
</script>
</body>
</html>
